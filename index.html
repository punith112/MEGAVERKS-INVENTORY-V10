<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MEGAVERKS Inventory V10</title>
<style>
:root{--bg:#f8fafc;--card:#fff;--line:#e2e8f0;--ink:#0f172a;--mut:#64748b;--ind:#4f46e5;--ind2:#6366f1;
--red:#dc2626;--amb:#d97706;--grn:#059669;--blu:#2563eb;--vio:#7c3aed;--slate:#0f172a}
*{box-sizing:border-box;margin:0}body{font-family:ui-sans-serif,system-ui,Segoe UI,Roboto,Arial;background:var(--bg);color:var(--ink);font-size:14px}
header{background:var(--slate);border-bottom:1px solid #334155;position:sticky;top:0;z-index:40}
.hwrap{max-width:1400px;margin:auto;padding:10px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.logo{width:34px;height:34px;border-radius:8px;background:var(--ind);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800}
.brand{color:#fff;font-weight:700;font-size:13px;line-height:1.15}.brand small{color:#a5b4fc;font-weight:500;font-size:10.5px}
nav{display:flex;flex-wrap:wrap;gap:3px}
nav a{display:flex;gap:5px;align-items:center;padding:6px 11px;border-radius:6px;color:#cbd5e1;text-decoration:none;font-size:13px;font-weight:500}
nav a.on{background:var(--ind);color:#fff}nav a:hover{background:#334155;color:#fff}
.actor{margin-left:auto;background:none;border:1px solid #475569;color:#fcd34d;padding:6px 11px;border-radius:6px;cursor:pointer;font-size:13px}
.actor.set{color:#6ee7b7;border-color:#059669}
main{max-width:1400px;margin:auto;padding:18px 14px 60px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:13px;display:flex;gap:11px;align-items:center;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.ic{width:38px;height:38px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:17px;flex:none}
.stat b{font-size:19px;display:block;line-height:1.1}.stat span{font-size:11px;color:var(--mut)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 1px 2px rgba(0,0,0,.04);overflow:hidden}
input,select,textarea{padding:8px 10px;border:1px solid #cbd5e1;border-radius:7px;font-size:13px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid #c7d2fe;border-color:var(--ind)}
.btn{padding:8px 14px;border-radius:7px;border:1px solid transparent;font-size:13px;font-weight:600;cursor:pointer;background:var(--ind);color:#fff}
.btn:hover{background:var(--ind2)}.btn.o{background:#fff;color:var(--ink);border-color:#cbd5e1}.btn.o:hover{background:#f1f5f9}
.btn.r{background:var(--red)}.btn.sm{padding:5px 9px;font-size:12px}.btn:disabled{opacity:.5;cursor:not-allowed}
.tblwrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#f1f5f9;text-align:left;padding:9px 10px;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;color:#475569;white-space:nowrap}
td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:middle}
tr:hover td{background:#f8fafc}.r{text-align:right}.mut{color:var(--mut)}.b{font-weight:700}
.badge{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;border:1px solid}
.g{background:#dcfce7;color:#15803d;border-color:#bbf7d0}.a{background:#fef3c7;color:#b45309;border-color:#fde68a}
.rd{background:#fee2e2;color:#b91c1c;border-color:#fecaca}.bl{background:#dbeafe;color:#1d4ed8;border-color:#bfdbfe}
.gr{background:#f1f5f9;color:#475569;border-color:#e2e8f0}.vi{background:#ede9fe;color:#6d28d9;border-color:#ddd6fe}
img.thumb{width:40px;height:40px;border-radius:6px;object-fit:cover;border:1px solid var(--line);cursor:pointer;background:#f1f5f9}
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.5);display:flex;align-items:flex-start;justify-content:center;padding:40px 14px;z-index:100;overflow:auto}
.modal{background:#fff;border-radius:12px;max-width:640px;width:100%;padding:18px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal h3{margin-bottom:12px;font-size:16px}.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.frow3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:10px}
.lbl{font-size:11px;font-weight:600;color:#475569;display:block;margin-bottom:4px;text-transform:uppercase}
.mfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
#toasts{position:fixed;top:14px;right:14px;z-index:300;display:flex;flex-direction:column;gap:8px}
.toast{background:#0f172a;color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.3);animation:tin .2s;max-width:340px}
.toast.err{background:var(--red)}.toast.ok{background:var(--grn)}
@keyframes tin{from{transform:translateX(30px);opacity:0}}
.h1{font-size:19px;font-weight:800;display:flex;gap:8px;align-items:center;margin-bottom:2px}
.sub{color:var(--mut);font-size:12px;margin-bottom:12px}.tabs{display:flex;gap:6px;margin-bottom:10px}
.note{background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:10px;font-size:12px;color:#92400e;margin:10px 0}
pre.pv{background:#f8fafc;border:1px solid var(--line);border-radius:8px;padding:10px;font-size:12px;max-height:220px;overflow:auto}
/* login */
.lock{position:fixed;inset:0;background:linear-gradient(160deg,#0f172a,#1e1b4b);display:flex;align-items:center;justify-content:center;z-index:500}
.lockbox{background:#fff;border-radius:16px;padding:30px;width:100%;max-width:380px;box-shadow:0 30px 80px rgba(0,0,0,.5);text-align:center}
.lockbox .logo{width:52px;height:52px;font-size:24px;margin:0 auto 12px}
.lockbox h2{font-size:16px;margin-bottom:2px}.lockbox p{font-size:12px;color:var(--mut);margin-bottom:18px}
.lockbox input{width:100%;text-align:center;font-size:16px;letter-spacing:2px;padding:11px;margin-bottom:10px}
.lockerr{color:var(--red);font-size:12px;min-height:16px;margin-bottom:6px}
.remember{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--mut);justify-content:center;margin-bottom:14px}
@media(max-width:700px){.frow,.frow3{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="hwrap">
  <div class="logo">M</div>
  <div class="brand">MEGAVERKS TECHNOLOGIES<br><small>& VENGREE METAL PUNCH PVT. LTD</small></div>
  <nav id="nav"></nav>
  <button class="actor" id="actorBtn" onclick="actorDialog()">Set your name</button>
  <span id="syncTag" title="Last cloud sync" style="color:#94a3b8;font-size:11px"></span>
  <button class="actor set" id="logoutBtn" style="display:none" onclick="logout()">⏻ Logout</button>
</div></header>
<main id="app"><p style="padding:40px;text-align:center;color:#64748b">Loading…</p></main>
<div id="toasts"></div>

<script>
/* ================= CONFIG / STATE ================= */
const API = localStorage.getItem('mv_api') || 'PASTE_YOUR_APPS_SCRIPT_EXEC_URL';
const API_UNSET = !localStorage.getItem('mv_api');
const ENTITIES = ['items','products','vendors','customers','invoices','payments','pos','poLines','bom','movements','audit'];
const DB = {}; let ACTOR = localStorage.getItem('mv_actor') || '';
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const inr = n => '₹' + Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:0});
const today = () => new Date().toISOString().slice(0,10);

function token(){ return sessionStorage.getItem('mv_tok') || localStorage.getItem('mv_tok') || ''; }
/* flat query-string when possible (works even with older deployed doGet), else JSON payload param */
function toQuery(p){
  const flat={};
  for(const k in p){ const v=p[k]; if(v==null||v==='') continue;
    if(typeof v==='object') return null;
    flat[k]=String(v); }
  return new URLSearchParams(flat).toString();
}
async function api(p){
  const full=Object.assign({actor:ACTOR,token:token()},p);
  const body=JSON.stringify(full);
  let r, text;
  try{
    r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body,redirect:'follow'});
    text=await r.text();
  }catch(e){
    throw new Error('Cannot reach the backend — check your internet and that the Apps Script /exec URL is saved in Admin → Settings.');
  }
  /* HTTP 405 = the deployment refused POST (stale version, library URL, or a proxy).
     Retry once as GET — the fixed Code.gs understands both plain params and ?payload=JSON. */
  if(r.status===405 && body.length<6000){
    try{
      const qs=toQuery(full) || ('payload='+encodeURIComponent(body));
      const r2=await fetch(API+(API.includes('?')?'&':'?')+qs,{method:'GET',redirect:'follow'});
      const t2=await r2.text();
      if(t2){ r=r2; text=t2; }
    }catch(e){ /* keep the original 405 response for the error message below */ }
  }
  let j = null;
  try{ j = JSON.parse(text); }
  catch(e){
    const head = text.slice(0, 4000);
    if(/accounts\.google\.com|sign in to continue|ServiceLogin/i.test(head))
      throw new Error('The web app asked for a Google sign-in. Fix: Apps Script → Deploy → Manage deployments → ✏️ → set "Who has access" to "Anyone" → Deploy, then copy the new /exec URL into Admin → Settings.');
    if(r.status===405)
      throw new Error('HTTP 405 — the deployed script refused the request. Fix: paste the latest Code.gs in Apps Script, then Deploy → Manage deployments → ✏️ → Version "New version" → Deploy, and copy the Web app /exec URL (NOT the "Library" URL) into Admin → Settings.');
    if(r.status >= 400 || /Service Unavailable|scripts\.google\.com/i.test(head))
      throw new Error('Apps Script returned HTTP ' + r.status + '. Fix: Deploy → Manage deployments → ✏️ → "New version" → Deploy, and copy the /exec URL again.');
    throw new Error('Backend returned a web page instead of data — the saved URL is probably wrong. Use the Web app /exec URL from Deploy → Manage deployments (not the Library URL).');
  }
  if(!j.ok){
    if(/Not authorised/i.test(j.error||'')){ // session expired / passcode changed
      sessionStorage.removeItem('mv_tok'); localStorage.removeItem('mv_tok');
      toast('Session expired — sign in again','err'); setTimeout(()=>location.reload(),800);
    }
    throw new Error(j.error||'API error');
  }
  return j.data;
}
async function loadAll(){
  const parts = await Promise.all(ENTITIES.map(e=>api({action:'list',entity:e}).catch(()=>[])));
  ENTITIES.forEach((e,i)=>DB[e]=parts[i]);
}

/* ---------- passcode gate ---------- */
function showLock(){
  return new Promise(resolve=>{
    const d=document.createElement('div'); d.className='lock';
    d.innerHTML=`<div class="lockbox">
      <div class="logo">M</div>
      <h2>MEGAVERKS Inventory V10</h2>
      <p>Enter the passcode to continue</p>
      <input id="lk_pass" type="password" placeholder="••••••••" autocomplete="current-password">
      <div class="lockerr" id="lk_err"></div>
      <label class="remember"><input type="checkbox" id="lk_rem"> Keep me signed in on this device</label>
      <button class="btn" style="width:100%" id="lk_go">Unlock</button>
      ${API_UNSET?`<p style="margin-top:12px"><a href="#admin" id="lk_setup" style="font-size:12px;color:#6366f1">First time? Set up the backend connection →</a></p>`:''}</div>`;
    document.body.appendChild(d);
    const go=async()=>{
      const btn=$('#lk_go'); btn.disabled=true; $('#lk_err').textContent='';
      if(API_UNSET){ $('#lk_err').textContent='No backend URL saved yet — click "Set up the backend connection" below.'; btn.disabled=false; return; }
      try{
        const res=await api({action:'verify',passcode:$('#lk_pass').value});
        if(res.valid){
          if($('#lk_rem').checked) localStorage.setItem('mv_tok',res.token);
          else sessionStorage.setItem('mv_tok',res.token);
          d.remove(); resolve(true); return;
        }
        $('#lk_err').textContent='Wrong passcode — try again';
      }catch(e){ $('#lk_err').textContent=e.message; }
      btn.disabled=false;
    };
    $('#lk_go').onclick=go;
    $('#lk_pass').onkeydown=e=>{ if(e.key==='Enter') go(); };
    const setup=$('#lk_setup');
    if(setup) setup.onclick=e=>{ e.preventDefault(); d.remove(); resolve(false); };
    setTimeout(()=>$('#lk_pass').focus(),100);
  });
}
async function gate(){
  if(token()) return true;               // already have a (day) token
  return showLock();                     // blocks until unlocked
}
function logout(){
  sessionStorage.removeItem('mv_tok'); localStorage.removeItem('mv_tok');
  location.reload();
}

/* ================= UI helpers ================= */
function toast(msg,type){ const t=document.createElement('div'); t.className='toast '+(type||''); t.textContent=msg;
  $('#toasts').appendChild(t); setTimeout(()=>t.remove(), type==='err'?6000:3200); }
function modal(title, body, foot){
  const o=document.createElement('div'); o.className='overlay';
  o.innerHTML=`<div class="modal"><h3>${title}</h3>${body}<div class="mfoot">${foot||''}</div></div>`;
  o.onclick=e=>{ if(e.target===o) o.remove(); }; document.body.appendChild(o); return o;
}
function actorDialog(){
  const o=modal('Who is using the app?',`<p class="sub">Your name is attached to every change (audit log). It stays on this device.</p>
    <input id="aName" style="width:100%" value="${esc(ACTOR)}" placeholder="e.g. Arun Kumar">`,
    `<button class="btn o" onclick="this.closest('.overlay').remove()">Cancel</button><button class="btn" onclick="saveActor()">Save</button>`);
  o.querySelector('#aName').focus();
}
function saveActor(){ const v=$('#aName').value.trim(); if(!v) return toast('Enter your name','err');
  ACTOR=v; localStorage.setItem('mv_actor',v); $('#actorBtn').textContent=v; $('#actorBtn').classList.add('set');
  document.querySelector('.overlay').remove(); toast('Working as '+v,'ok'); }
function confirmDlg(msg,fn){ modal('Please confirm',`<p>${msg}</p>`,
  `<button class="btn o" onclick="this.closest('.overlay').remove()">Cancel</button><button class="btn r" id="cfYes">Yes, proceed</button>`)
  .querySelector('#cfYes').onclick=()=>{ document.querySelector('.overlay').remove(); fn(); }; }

/* ================= IMAGES (Google Drive) ================= */
function fileToDataUrl(file,maxW,q){ return new Promise((res,rej)=>{ const rd=new FileReader();
  rd.onload=()=>{ const img=new Image(); img.onload=()=>{ let w=img.width,h=img.height;
    const s=Math.min(1,(maxW||1200)/w); const c=document.createElement('canvas');
    c.width=Math.round(w*s); c.height=Math.round(h*s); c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    res(c.toDataURL('image/jpeg',q||0.75)); }; img.onerror=()=>rej(new Error('Invalid image'));
    img.src=String(rd.result); }; rd.onerror=()=>rej(new Error('Read failed')); rd.readAsDataURL(file); }); }
/* upload to the Drive folder via the script; only the returned link is stored in the sheet */
async function driveUpload(file){
  const dataUrl=await fileToDataUrl(file,1200,0.75);
  const r=await api({action:'uploadImage',name:file.name||'image.jpg',dataUrl:dataUrl});
  return r;
}
function isImgUrl(v){ return v && !/^data:/.test(v); }

/* ================= CSV ================= */
function parseCSV(text){
  const rows=[]; let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){ const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else if(c==='"') q=true;
    else if(c===','){ row.push(cur); cur=''; }
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(cur); rows.push(row); row=[]; cur=''; }
    else cur+=c; }
  if(cur!==''||row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r=>r.some(c=>String(c).trim()!==''));
}
function toCSV(rows){ return rows.map(r=>r.map(c=>{ c=String(c==null?'':c);
  return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c; }).join(',')).join('\n'); }
function download(name,text,mime){ const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([text],{type:mime||'text/csv'})); a.download=name; a.click(); }
const normH = s => String(s||'').trim().toLowerCase().replace(/\(.*?\)/g,'').replace(/[^a-z0-9]+/g,' ').trim();
function mapHeaders(headerRow, aliasMap){
  const map={};
  headerRow.forEach((h,idx)=>{ const n=normH(h);
    for(const key in aliasMap) if(aliasMap[key].some(a=>normH(a)===n)){ map[key]=idx; break; } });
  return map;
}
const ALIASES = {
  items:{name:['Item Name','Name','Name of Items','Item'],partNumber:['Part Number','Part No','PartNumber'],company:['Company'],vendorName:['Vendor Name','Vendor'],materialType:['Material Type','Material'],source:['Source'],price:['Price'],moq:['MOQ'],leadTime:['Lead Time'],stockInHand:['Stock In Hand','Stock','Qty','Quantity'],minStock:['Min Stock','Minimum Stock']},
  vendors:{name:['Vendor Name','Name','Vendor'],contactPerson:['Contact Person','Contact'],phone:['Phone','Mobile'],email:['Email'],address:['Address'],gstin:['GSTIN','GST','GST No'],googleLocation:['Google Location','Location'],purchaseManager:['Purchase Manager','Manager'],creditLimit:['Credit Limit'],creditDays:['Credit Days'],notes:['Notes']},
  products:{name:['Product Name','Name','Product','Article','Article Name'],company:['Company'],description:['Description','Description / Packing Instructions']},
  pos:{poNumber:['PO Number','PO No','PO'],poDate:['PO Date','Date'],customerName:['Customer Name','Customer'],customerPartName:['Customer Part Name','Customer Item'],customerPartNumber:['Customer Part Number','Customer Part No'],productName:['Our Product / Article','Product','Article','Product Name'],qty:['Qty','Quantity'],notes:['Notes']}
};

/* ================= ROUTER ================= */
const PAGES = [
  ['inventory','📦','Inventory'],['orders','📋','Orders'],['customers','👤','Customers'],
  ['analysis','📊','Analysis'],['bills','🧾','Bills'],['vendors','🚚','Vendors'],
  ['products','🧩','Products'],['admin','🛡️','Admin']
];
function route(){
  const h=(location.hash||'#inventory').slice(1);
  $('#nav').innerHTML=PAGES.map(p=>`<a href="#${p[0]}" class="${p[0]===h?'on':''}">${p[1]} ${p[2]}</a>`).join('');
  ({inventory:pgInventory,products:pgProducts,vendors:pgVendors,bills:pgBills,
    customers:pgCustomers,orders:pgOrders,analysis:pgAnalysis,admin:pgAdmin}[h]||pgInventory)();
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);

/* ================= SHARED ================= */
function statCards(cards){ return `<div class="stats">${cards.map(c=>
  `<div class="stat"><div class="ic" style="background:${c.bg};color:${c.fg}">${c.icon}</div>
   <div><b>${c.v}</b><span>${c.l}</span></div></div>`).join('')}</div>`; }
function item(id){ return DB.items.find(i=>Number(i.id)===Number(id)); }
function product(id){ return DB.products.find(p=>Number(p.id)===Number(id)); }
function vendor(id){ return DB.vendors.find(v=>Number(v.id)===Number(id)); }
function customer(id){ return DB.customers.find(c=>Number(c.id)===Number(id)); }
function stockStatus(it){ const h=Number(it.stockInHand)||0;
  if(h===0) return ['OUT OF STOCK','rd']; if(Number(it.minStock)>0&&h<Number(it.minStock)) return ['LOW STOCK','a'];
  return ['AVAILABLE','g']; }
function vendorOptions(sel){ return `<option value="">— No vendor —</option>`+DB.vendors.map(v=>
  `<option value="${v.id}" ${Number(sel)===Number(v.id)?'selected':''}>${esc(v.name)}</option>`).join(''); }
function productOptions(sel){ return `<option value="">— Not linked —</option>`+DB.products.map(p=>
  `<option value="${p.id}" ${Number(sel)===Number(p.id)?'selected':''}>${esc(p.name)}</option>`).join(''); }
function customerOptions(sel){ return DB.customers.map(c=>
  `<option value="${c.id}" ${Number(sel)===Number(c.id)?'selected':''}>${esc(c.name)}</option>`).join(''); }
function exportCSV(name,headers,rows){ download(name+'.csv',toCSV([headers].concat(rows)),'text/csv'); toast('Exported '+name,'ok'); }
function reloadAndStay(msg,type){ return loadAll().then(()=>{ syncStamp(); route(); if(msg) toast(msg,type||'ok'); }); }

/* ---------- automatic cloud sync ---------- */
let _syncT=null;
function syncStamp(){ const t=$('#syncTag'); if(t) t.textContent='Synced '+new Date().toLocaleTimeString(); }
function startAutoSync(){
  clearInterval(_syncT);
  _syncT=setInterval(async()=>{
    if(document.querySelector('.overlay') || document.querySelector('.lock')) return; // don't clobber open dialogs
    const before=JSON.stringify(DB);
    try{ await loadAll(); }catch(e){ const t=$('#syncTag'); if(t) t.textContent='⚠ offline'; return; }
    if(JSON.stringify(DB)!==before){ syncStamp(); route(); toast('New data synced from the cloud','ok'); }
    else syncStamp();
  }, 45000);
  window.addEventListener('focus',()=>{ if(document.querySelector('.overlay')||document.querySelector('.lock')) return;
    loadAll().then(syncStamp).catch(()=>{}); });   // pull latest whenever the tab is brought back
}

/* ================= INVENTORY ================= */
let invF={search:'',company:'ALL',productId:'ALL',source:'ALL',materialType:'ALL'};
function pgInventory(){
  const items=DB.items, prods=DB.products;
  const totQty=items.reduce((s,i)=>s+(Number(i.stockInHand)||0),0);
  const totVal=items.reduce((s,i)=>s+(Number(i.stockInHand)||0)*(Number(i.price)||0),0);
  const low=items.filter(i=>Number(i.minStock)>0&&(Number(i.stockInHand)||0)<Number(i.minStock)).length;
  const out=items.filter(i=>(Number(i.stockInHand)||0)===0).length;
  const mtypes=[...new Set(items.map(i=>i.materialType).filter(Boolean))].sort();
  const f=invF;
  const filtered=items.filter(i=>{
    const q=f.search.toLowerCase();
    if(q && !((i.name||'')+' '+(i.partNumber||'')+' '+(i.vendorName||'')).toLowerCase().includes(q)) return false;
    if(f.company!=='ALL'&&i.company!==f.company) return false;
    if(f.productId!=='ALL'&&Number(i.productId)!==Number(f.productId)) return false;
    if(f.source!=='ALL'&&(i.source||'vendor')!==f.source) return false;
    if(f.materialType!=='ALL'&&i.materialType!==f.materialType) return false;

function vendorStats(v){
  const invs=DB.invoices.filter(i=>Number(i.vendorId)===Number(v.id));
  const pays=DB.payments.filter(p=>Number(p.vendorId)===Number(v.id));
  const totInv=invs.reduce((s,i)=>s+Number(i.total||0),0);
  const totPaid=pays.reduce((s,p)=>s+Number(p.amount||0),0);
  const last=pays.map(p=>p.paymentDate).sort().pop()||null;
  return {invoiceCount:invs.length,totalInvoiced:totInv,totalPaid:totPaid,balance:totInv-totPaid,lastPaymentDate:last}; }

function billCalc(d){
  const sub=d.lines.reduce((s,l)=>s+Number(l.qty||0)*Number(l.rate||0),0);
  const taxType=d.taxType||'NONE', gstRate=Number(d.gstRate||0);
  const taxAmt=taxType==='NONE'?0:(taxType==='GST_INCL'?sub*gstRate/(100+gstRate):sub*gstRate/100);
  const total=taxType==='GST_INCL'?sub:sub+taxAmt;
  return {sub:+sub.toFixed(2), taxAmt:+taxAmt.toFixed(2), total:+total.toFixed(2), taxType, gstRate};
}

  const d=billDraft, c=billCalc(d);

  d.lines.forEach((l,ix)=>{ const n=document.getElementById('b_amt_'+ix); if(n) n.textContent=inr(Number(l.qty||0)*Number(l.rate||0)); });
  const t=$('#b_total'); if(t) t.textContent=inr(c.total);
}

  $('#b_cd').oninput=e=>billDraft.creditDays=e.target.value;

}
async function runOcr(){ const tok=localStorage.getItem('mv_hf'); if(!tok) return toast('Set your Hugging Face token in Admin → Settings','err');
  const f=billDraft&&billDraft._ocrFile; if(!f) return toast('Choose an image in the OCR field first','err');
  try{
    toast('Running OCR (baidu/Unlimited-OCR)…');
    const dataUrl=await fileToDataUrl(f,1600,0.85);
    let txt='';
    /* Current HF API: OpenAI-compatible chat completions on the router.
       (The old hf-inference/models endpoint returns 404/410 for vision-language models.) */
    const r=await fetch('https://router.huggingface.co/v1/chat/completions',{
      method:'POST',
      headers:{Authorization:'Bearer '+tok,'Content-Type':'application/json'},
      body:JSON.stringify({
        model:'baidu/Unlimited-OCR',
        messages:[{role:'user',content:[
          {type:'text',text:'Extract ALL text from this invoice image exactly as printed: vendor name, invoice number, date, GSTIN, every line item (description, qty, rate, amount), tax amounts and grand total. Output plain text only, no commentary.'},
          {type:'image_url',image_url:{url:dataUrl}}]}],
        max_tokens:2500, stream:false })});
    if(r.ok){
      const j=await r.json().catch(()=>null);
      if(j&&j.choices&&j.choices[0]&&j.choices[0].message) txt=j.choices[0].message.content||'';
      else if(typeof j==='string') txt=j;
      else if(j&&(j.generated_text||j.text)) txt=j.generated_text||j.text;
    }
    if(!txt){ /* fallback: legacy task endpoint — some deployments still answer here */
      const r2=await fetch('https://router.huggingface.co/hf-inference/models/baidu/Unlimited-OCR',{
        method:'POST',headers:{Authorization:'Bearer '+tok,'Content-Type':'application/octet-stream'},body:f});
      const raw2=await r2.text();
      if(!r2.ok){
        if(/deprecated|no longer supported/i.test(raw2))
          throw new Error('OCR unavailable: HF no longer serves this model on the free inference API (HTTP '+r2.status+'). You can still attach the photo and type the bill manually.');
        throw new Error('OCR failed: HTTP '+r2.status+' — '+(raw2.slice(0,160)||'check the token has "Make calls to Inference Providers" permission'));
      }
      let j2=null; try{ j2=JSON.parse(raw2); }catch(e){ txt=raw2; }
      if(j2){ if(typeof j2==='string') txt=j2;
        else if(Array.isArray(j2)&&j2[0]) txt=j2[0].generated_text||j2[0].text||'';
        else txt=j2.generated_text||j2.text||''; }
    }
    txt=String(txt||'').trim();
    if(!txt) throw new Error('OCR returned no text — try a clearer, straight-on photo of the bill.');
    const nb=$('#b_notes'); const cur=nb.value.trim();
    nb.value=(cur?cur+'\n\n':'')+txt.slice(0,4000);
    billDraft.notes=nb.value;
    toast('Text extracted to Notes — review and map line items','ok');
  }catch(e){ toast(e.message,'err'); } }
async function saveBill(){ const d=billDraft; d.vendorId=$('#b_ven').value; d.invoiceNumber=$('#b_no').value.trim();

function poRequirements(p){ const lines=DB.poLines.filter(l=>Number(l.poId)===Number(p.id));
  const req={}; let noBom=true;
  lines.forEach(l=>{ DB.bom.filter(b=>Number(b.productId)===Number(l.productId)).forEach(b=>{ noBom=false;
    req[b.itemId]=(req[b.itemId]||0)+Number(b.qtyPer)*Number(l.qty); }); });
  if(noBom) return `<p class="mut">No BOM defined for these products — define it in Products to check material position.</p>`;
  const ids=Object.keys(req); const ok=ids.every(iid=>(Number((item(iid)||{}).stockInHand)||0)>=req[iid]);
  return `<p>${ok?'<span class="badge g">SUFFICIENT STOCK</span>':'<span class="badge rd">INSUFFICIENT</span>'}</p>
  <table style="margin-top:8px"><thead><tr><th>Item</th><th class="r">Required</th><th class="r">In Hand</th><th class="r">Gap</th></tr></thead><tbody>
  ${ids.map(iid=>{ const it=item(iid)||{}; const gap=(Number(it.stockInHand)||0)-req[iid];
    return `<tr><td>${esc(it.name||'?')}</td><td class="r">${req[iid]}</td><td class="r">${it.stockInHand||0}</td>
    <td class="r" style="color:${gap<0?'#dc2626':'#059669'};font-weight:700">${gap<0?gap:'+'+gap}</td></tr>`; }).join('')}</tbody></table>`; }

async function savePo(){ const d=poDraft; d.poNumber=$('#po_no').value.trim(); d.customerId=$('#po_cust').value;

      status:'OPEN',notes:$('#po_notes').value,dispatchedBy:'',dispatchedAt:''}});

/* ================= ANALYSIS ================= */
let deadDays=90;
function computeAnalysis(){
  const openPos=DB.pos.filter(p=>p.status==='OPEN');
  const bomByProd={}; DB.bom.forEach(b=>{(bomByProd[b.productId]=bomByProd[b.productId]||[]).push(b);});
  const required={}; const poRows=openPos.map(po=>{
    let totalQty=0; const poReq={};
    DB.poLines.filter(l=>Number(l.poId)===Number(po.id)).forEach(l=>{ totalQty+=Number(l.qty||0);
      (bomByProd[l.productId]||[]).forEach(b=>{ const need=Number(b.qtyPer)*Number(l.qty);
        poReq[b.itemId]=(poReq[b.itemId]||0)+need; required[b.itemId]=(required[b.itemId]||0)+need; }); });
    let shortageUnits=0;
    for(const iid in poReq){ const onHand=Number((item(iid)||{}).stockInHand)||0;
      if(poReq[iid]>onHand) shortageUnits+=poReq[iid]-onHand; }
    return {id:po.id,poNumber:po.poNumber,poDate:po.poDate,customerName:(customer(po.customerId)||{}).name||'—',
      totalQty,sufficient:shortageUnits===0,shortageUnits}; });
  const price=it=>Number(it.price)||0;
  const shortfalls=[],excess=[];
  DB.items.forEach(i=>{ const req=required[i.id]||0; const onHand=Number(i.stockInHand)||0;
    if(req>onHand){ const s=req-onHand; shortfalls.push({itemId:i.id,itemName:i.name,partNumber:i.partNumber,materialType:i.materialType,
      source:i.source,vendorName:i.vendorName,required:req,onHand,shortage:s,shortageValue:+(s*price(i)).toFixed(2)}); }
    else if(onHand>req){ const ex=onHand-req; excess.push({itemId:i.id,itemName:i.name,partNumber:i.partNumber,materialType:i.materialType,
      source:i.source,onHand,requiredByOpenPos:req,excess:ex,excessValue:+(ex*price(i)).toFixed(2)}); } });
  shortfalls.sort((a,b)=>b.shortageValue-a.shortageValue); excess.sort((a,b)=>b.excessValue-a.excessValue);
  const lastMove={}; DB.movements.forEach(m=>{ const d=new Date(m.createdAt);
    if(!lastMove[m.itemId]||d>lastMove[m.itemId]) lastMove[m.itemId]=d; });
  const now=Date.now(); const deadStock=[];
  DB.items.forEach(i=>{ const onHand=Number(i.stockInHand)||0; if(onHand<=0) return;
    const last=lastMove[i.id]||new Date(i.createdAt); const daysIdle=Math.floor((now-last.getTime())/86400000);
    if(daysIdle>=deadDays) deadStock.push({itemId:i.id,itemName:i.name,partNumber:i.partNumber,materialType:i.materialType,
      source:i.source,onHand,stockValue:+(onHand*price(i)).toFixed(2),lastMovement:last.toISOString().slice(0,10),daysIdle}); });
  deadStock.sort((a,b)=>b.daysIdle-a.daysIdle);
  const totals={openPos:openPos.length,shortfallItems:shortfalls.length,
    shortfallUnits:shortfalls.reduce((s,r)=>s+r.shortage,0),shortfallValue:+shortfalls.reduce((s,r)=>s+r.shortageValue,0).toFixed(2),
    excessItems:excess.length,excessValue:+excess.reduce((s,r)=>s+r.excessValue,0).toFixed(2),
    deadItems:deadStock.length,deadValue:+deadStock.reduce((s,r)=>s+r.stockValue,0).toFixed(2),
    lowStock:DB.items.filter(i=>Number(i.minStock)>0&&(Number(i.stockInHand)||0)<Number(i.minStock)).length};
  return {totals,shortfalls,excess,deadStock,openPos:poRows.sort((a,b)=>b.id-a.id)};
}

   ${A.excess.slice(0,100).map(s=>`<tr><td><div class="b">${esc(s.itemName)}</div><div class="mut" style="font-size:11px">${esc(s.partNumber||'')}</div></td>

   </tbody></table></div></div>
  <div class="card"><div style="padding:14px 14px 4px;font-weight:700;color:#334155">📦 Idle / Dead Stock (no movement in ${deadDays}+ days)</div>
   <div class="tblwrap" style="padding:10px 14px 14px"><table><thead><tr><th>Item</th><th>Material</th><th class="r">In Hand</th><th class="r">Value</th><th>Last Movement</th><th class="r">Days Idle</th></tr></thead><tbody>
   ${A.deadStock.length===0?`<tr><td colspan="6" class="mut" style="text-align:center;padding:20px">Nothing idle for ${deadDays}+ days — stock is moving well.</td></tr>`:
     A.deadStock.map(s=>`<tr><td><div class="b">${esc(s.itemName)}</div><div class="mut" style="font-size:11px">${esc(s.partNumber||'')}</div></td>

     <td class="r"><span class="badge ${s.daysIdle>=180?'rd':'gr'}">${s.daysIdle}d</span></td></tr>`).join('')}
   </tbody></table></div></div>`;
}

async function changePass(){
  const cur=$('#pc_cur').value, nw=$('#pc_new').value, cf=$('#pc_cf').value;
  if(nw.length<4) return toast('New passcode must be at least 4 characters','err');
  if(nw!==cf) return toast('New passcodes do not match','err');
  try{ $('#pcGo').disabled=true;
    await api({action:'changePasscode',current:cur,next:nw});

    $('#pc_cur').value=$('#pc_new').value=$('#pc_cf').value=''; }
  catch(e){ toast(e.message,'err'); }

    box.innerHTML=`<p style="margin:4px 0 6px"><span class="badge ${r.pass?'g':'rd'}">${r.okCount}/${r.total} checks passed</span>
      <span class="mut" style="font-size:11px"> ${esc(r.time)}</span></p>
      <table style="font-size:12.5px">${r.checks.map(c=>`<tr><td style="padding:3px 8px">${c.ok?'✅':'❌'}</td>
        <td style="padding:3px 8px">${esc(c.name)}</td><td class="mut" style="padding:3px 8px">${esc(c.detail)}</td></tr>`).join('')}</table>`;
    toast(r.pass?'Backend self-test passed ✓':'Self-test found issues — see below', r.pass?'ok':'err');
  }catch(e){
    box.innerHTML=`<p style="color:#dc2626;font-size:12.5px">Self-test failed: ${esc(e.message)}</p>`;
  }
  if(btn) btn.disabled=false;
}
async function restoreAll(inp){ const f=inp.files[0]; if(!f) return;
  if(!confirm('Restore '+f.name+' ? Existing rows with same IDs are overwritten; new rows appended.')) return;
  try{ const data=JSON.parse(await f.text());
    for(const e of ENTITIES){ if(e==='audit') continue;
      for(const rec of (data[e]||[])) await api({action:'update',entity:e,record:rec}).catch(()=>api({action:'create',entity:e,record:rec})); }
    reloadAndStay('Restore complete'); }catch(e){ toast('Restore failed: '+e.message,'err'); } }
function bulkDlg(entity){
  const names={items:'Inventory Items',vendors:'Vendors',products:'Products',pos:'Purchase Orders'};
  const notes={items:['Existing items (same company + name + part number) are updated; new ones added.',
    "Vendor names matching the Vendor Database are auto-linked.","Columns (any order): "+Object.keys(ALIASES.items).join(', ')],
    vendors:['Matched by vendor name (update) else created. Credit days default 30.'],
    products:['Matched by name + company.'],
    pos:['One row per line — repeat the PO Number for each line. Customers auto-created; products must exist; existing PO numbers skipped.']};
  modal('Bulk Upload — '+names[entity],`
  ${notes[entity].map(n=>`<div class="note" style="margin:4px 0">${esc(n)}</div>`).join('')}
  <span class="lbl">Paste CSV (copied from Excel) or choose a .csv file</span>
  <input type="file" id="bk_file" accept=".csv" style="margin-bottom:8px">
  <textarea id="bk_text" rows="7" style="width:100%" placeholder="Item Name,Part Number,Vendor Name,Price,Stock In Hand&#10;M6 CAGE NUT,M6 X 20,BENGLORE FASTENERS,3.40,2000"></textarea>
  <div id="bk_prev"></div>`,
  `<button class="btn o" onclick="document.querySelector('.overlay').remove()">Cancel</button><button class="btn" id="bkGo" onclick="runBulk('${entity}')">Upload</button>`);
  $('#bk_file').onchange=async e=>{ const f=e.target.files[0]; if(f) $('#bk_text').value=await f.text(); };
}
async function runBulk(entity){
  const grid=parseCSV($('#bk_text').value); if(grid.length<2) return toast('Paste CSV with a header row first','err');
  const map=mapHeaders(grid[0],ALIASES[entity]); if(map.name===undefined&&entity!=='pos') return toast('Could not find a name column — check headers','err');
  if(entity==='pos'&&map.poNumber===undefined) return toast('Could not find PO Number column','err');
  const rows=grid.slice(1).map(r=>{ const o={}; for(const k in map) o[k]=r[map[k]]||''; return o; }).filter(o=>Object.values(o).some(v=>String(v).trim()));
  if(!rows.length) return toast('No data rows','err');
  $('#bk_prev').innerHTML=`<pre class="pv">Parsed ${rows.length} row(s):\n${esc(JSON.stringify(rows.slice(0,5),null,1))}${rows.length>5?'\n…':''}</pre>`;
  try{ $('#bkGo').disabled=true;
    const res=await api({action:'bulk',entity,rows});
    document.querySelector('.overlay').remove();
    reloadAndStay(`Bulk done — ${res.added||0} added, ${res.updated||0} updated${res.skipped?`, ${res.skipped} skipped`:''}`); }
  catch(e){ $('#bkGo').disabled=false; toast(e.message,'err'); } }

/* ================= BOOT ================= */
(async function(){
  if(ACTOR){ $('#actorBtn').textContent=ACTOR; $('#actorBtn').classList.add('set'); }
  const ok=await gate();                 // passcode screen first
  if(!ok){                               // setup mode: no backend URL yet → open Admin directly
    location.hash='#admin'; route();
    setTimeout(()=>toast('Paste your Apps Script /exec URL below and Save Settings','err'),300);
    return;
  }
  $('#logoutBtn').style.display='block';
  try{ await loadAll(); }
  catch(e){ $('#app').innerHTML=`<div class="card" style="padding:24px;max-width:560px;margin:40px auto">
    <b>Cannot reach the backend.</b><p class="sub" style="margin:8px 0">${esc(e.message)}</p>
    <p style="font-size:13px">1. Create the Apps Script (Code.gs) in a Google Sheet → Deploy → Web app (access: <i>Anyone</i>).<br>
    2. Open <a href="#admin">Admin → Settings</a> and paste the <code>/exec</code> URL, then reload.</p>
    <a class="btn" href="#admin" style="display:inline-block;text-decoration:none">Go to Settings</a></div>`; }
  syncStamp();
  startAutoSync();
  // once-per-day cloud backup (server no-ops if already backed up in last 24h)
  api({action:'autoBackup'}).then(r=>{ if(r && r.backedUp) toast('Daily cloud backup created in Drive folder "MEGAVERKS Backups"','ok'); }).catch(()=>{});
  route();
})();
</script>

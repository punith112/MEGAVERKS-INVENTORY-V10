<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MEGAVERKS Inventory V10</title>
<style>
:root{--bg:#f8fafc;--card:#fff;--line:#e2e8f0;--ink:#0f172a;--mut:#64748b;--ind:#4f46e5;--ind2:#6366f1;
--red:#dc2626;--amb:#d97706;--grn:#059669;--blu:#2563eb;--vio:#7c3aed;--slate:#0f172a}
*{box-sizing:border-box;margin:0}body{font-family:ui-sans-serif,system-ui,Segoe UI,Roboto,Arial;background:var(--bg);color:var(--ink);font-size:14px}
header{background:var(--slate);border-bottom:1px solid #334155;position:sticky;top:0;z-index:40}
.hwrap{max-width:1400px;margin:auto;padding:10px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.logo{width:34px;height:34px;border-radius:8px;background:var(--ind);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800}
.brand{color:#fff;font-weight:700;font-size:13px;line-height:1.15}.brand small{color:#a5b4fc;font-weight:500;font-size:10.5px}
nav{display:flex;flex-wrap:wrap;gap:3px}
nav a{display:flex;gap:5px;align-items:center;padding:6px 11px;border-radius:6px;color:#cbd5e1;text-decoration:none;font-size:13px;font-weight:500}
nav a.on{background:var(--ind);color:#fff}nav a:hover{background:#334155;color:#fff}
.actor{margin-left:auto;background:none;border:1px solid #475569;color:#fcd34d;padding:6px 11px;border-radius:6px;cursor:pointer;font-size:13px}
.actor.helpbtn{margin-left:0;border-color:#6366f1;color:#c7d2fe}
.helpbox h4{margin:14px 0 4px;font-size:13px;color:#1e1b4b}
.helpbox ol,.helpbox ul{margin:4px 0 4px 18px;font-size:12.5px;color:#334155;line-height:1.55}
.helpbox li{margin-bottom:2px}
.helpbox b{color:#0f172a}
.imgcell{display:flex;flex-direction:column;gap:3px;align-items:flex-start}
.imgtools{display:flex;gap:3px}
.imgtools button{border:1px solid var(--line);background:#fff;border-radius:5px;font-size:11px;padding:1px 6px;cursor:pointer;line-height:1.4}
.imgtools button:hover{background:#f1f5f9}
.imgadd{cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center}
.imgadd:hover{background:#e0e7ff !important;color:#6366f1 !important}
.actor.set{color:#6ee7b7;border-color:#059669}
main{max-width:1400px;margin:auto;padding:18px 14px 60px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:13px;display:flex;gap:11px;align-items:center;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.ic{width:38px;height:38px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:17px;flex:none}
.stat b{font-size:19px;display:block;line-height:1.1}.stat span{font-size:11px;color:var(--mut)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 1px 2px rgba(0,0,0,.04);overflow:hidden}
input,select,textarea{padding:8px 10px;border:1px solid #cbd5e1;border-radius:7px;font-size:13px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid #c7d2fe;border-color:var(--ind)}
.btn{padding:8px 14px;border-radius:7px;border:1px solid transparent;font-size:13px;font-weight:600;cursor:pointer;background:var(--ind);color:#fff}
.btn:hover{background:var(--ind2)}.btn.o{background:#fff;color:var(--ink);border-color:#cbd5e1}.btn.o:hover{background:#f1f5f9}
.btn.r{background:var(--red)}.btn.sm{padding:5px 9px;font-size:12px}.btn:disabled{opacity:.5;cursor:not-allowed}
.tblwrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#f1f5f9;text-align:left;padding:9px 10px;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;color:#475569;white-space:nowrap}
td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:middle}
tr:hover td{background:#f8fafc}.r{text-align:right}.mut{color:var(--mut)}.b{font-weight:700}
.badge{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;border:1px solid}
.g{background:#dcfce7;color:#15803d;border-color:#bbf7d0}.a{background:#fef3c7;color:#b45309;border-color:#fde68a}
.rd{background:#fee2e2;color:#b91c1c;border-color:#fecaca}.bl{background:#dbeafe;color:#1d4ed8;border-color:#bfdbfe}
.gr{background:#f1f5f9;color:#475569;border-color:#e2e8f0}.vi{background:#ede9fe;color:#6d28d9;border-color:#ddd6fe}
img.thumb{width:40px;height:40px;border-radius:6px;object-fit:cover;border:1px solid var(--line);cursor:pointer;background:#f1f5f9}
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.5);display:flex;align-items:flex-start;justify-content:center;padding:40px 14px;z-index:100;overflow:auto}
.modal{background:#fff;border-radius:12px;max-width:640px;width:100%;padding:18px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal h3{margin-bottom:12px;font-size:16px}.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.frow3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:10px}
.lbl{font-size:11px;font-weight:600;color:#475569;display:block;margin-bottom:4px;text-transform:uppercase}
.mfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
#toasts{position:fixed;top:14px;right:14px;z-index:300;display:flex;flex-direction:column;gap:8px}
.toast{background:#0f172a;color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.3);animation:tin .2s;max-width:340px}
.toast.err{background:var(--red)}.toast.ok{background:var(--grn)}
@keyframes tin{from{transform:translateX(30px);opacity:0}}
.h1{font-size:19px;font-weight:800;display:flex;gap:8px;align-items:center;margin-bottom:2px}
.sub{color:var(--mut);font-size:12px;margin-bottom:12px}.tabs{display:flex;gap:6px;margin-bottom:10px}
.note{background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:10px;font-size:12px;color:#92400e;margin:10px 0}
pre.pv{background:#f8fafc;border:1px solid var(--line);border-radius:8px;padding:10px;font-size:12px;max-height:220px;overflow:auto}
/* login */
.lock{position:fixed;inset:0;background:linear-gradient(160deg,#0f172a,#1e1b4b);display:flex;align-items:center;justify-content:center;z-index:500}
.lockbox{background:#fff;border-radius:16px;padding:30px;width:100%;max-width:380px;box-shadow:0 30px 80px rgba(0,0,0,.5);text-align:center}
.lockbox .logo{width:52px;height:52px;font-size:24px;margin:0 auto 12px}
.lockbox h2{font-size:16px;margin-bottom:2px}.lockbox p{font-size:12px;color:var(--mut);margin-bottom:18px}
.lockbox input{width:100%;text-align:center;font-size:16px;letter-spacing:2px;padding:11px;margin-bottom:10px}
.lockerr{color:var(--red);font-size:12px;min-height:16px;margin-bottom:6px}
.remember{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--mut);justify-content:center;margin-bottom:14px}
@media(max-width:700px){.frow,.frow3{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="hwrap">
  <div class="logo">M</div>
  <div class="brand">MEGAVERKS TECHNOLOGIES<br><small>& VENGREE METAL PUNCH PVT. LTD</small></div>
  <nav id="nav"></nav>
  <button class="actor helpbtn" id="helpBtn" onclick="showHelp()" title="How to use this app">❓ Help</button>
  <button class="actor" id="actorBtn" onclick="actorDialog()">Set your name</button>
  <span id="syncTag" title="Last cloud sync" style="color:#94a3b8;font-size:11px"></span>
  <button class="actor set" id="logoutBtn" style="display:none" onclick="logout()">⏻ Logout</button>
</div></header>
<main id="app"><p style="padding:40px 14px 8px;text-align:center;color:#64748b">Loading…</p>
<p style="text-align:center"><a href="#admin" style="font-size:12px;color:#6366f1" onclick="setTimeout(route,50)">Stuck here? Open Admin → Settings to fix the connection</a></p></main>
<div id="toasts"></div>

<script>
/* ================= CONFIG / STATE ================= */
/* Built-in default backend — the app works out of the box.
   Only override via Admin → Settings if you redeploy and the URL changes. */
const DEFAULT_API = 'https://script.google.com/macros/s/AKfycbwf86CQStIgulButlH0e4kJps1alZ2yodU8BIN7YVsWMvL7YiifuHE-YygoNRHGCSHJ/exec';
const API = localStorage.getItem('mv_api') || DEFAULT_API;
const API_UNSET = !localStorage.getItem('mv_api') && !DEFAULT_API;
const ENTITIES = ['items','products','vendors','customers','invoices','payments','pos','poLines','dispatches','bom','movements','audit','vendorPos','vendorPoLines','itemVendors','rawMaterials','rmMoves'];
const DB = {}; ENTITIES.forEach(e=>DB[e]=[]);   // pre-fill so pages render even before/without a backend
/* instant local-cache updates: a save shows on screen immediately; the sheet reconciles in the background */
function localUpsert(entity, rec){ if(!rec) return; const arr=DB[entity]||(DB[entity]=[]);
  const i=arr.findIndex(x=>Number(x.id)===Number(rec.id)); if(i>=0) arr[i]=Object.assign({},arr[i],rec); else arr.push(rec); }
function localRemove(entity, id){ const arr=DB[entity]||[]; const i=arr.findIndex(x=>Number(x.id)===Number(id)); if(i>=0) arr.splice(i,1); }
let ACTOR = localStorage.getItem('mv_actor') || '';
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const inr = n => '₹' + Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:0});
const today = () => new Date().toISOString().slice(0,10);

function token(){ return sessionStorage.getItem('mv_tok') || localStorage.getItem('mv_tok') || ''; }
/* never hang forever on a dead/wrong URL (override via localStorage mv_timeout for slow networks) */
const FETCH_TIMEOUT = Number(localStorage.getItem('mv_timeout')) || 20000;
/* flat query-string when possible (works even with older deployed doGet), else JSON payload param */
function toQuery(p){
  const flat={};
  for(const k in p){ const v=p[k]; if(v==null||v==='') continue;
    if(typeof v==='object') return null;
    flat[k]=String(v); }
  return new URLSearchParams(flat).toString();
}
async function api(p){
  const full=Object.assign({actor:ACTOR,token:token()},p);
  const body=JSON.stringify(full);
  let r, text;
  try{
    r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body,redirect:'follow',signal:AbortSignal.timeout(FETCH_TIMEOUT)});
    text=await r.text();
  }catch(e){
    throw new Error('Cannot reach the backend (timeout or offline) — check your internet and that the correct Apps Script /exec URL is saved in Admin → Settings.');
  }
  /* HTTP 405 = the deployment refused POST (stale version, library URL, or a proxy).
     Retry once as GET — the fixed Code.gs understands both plain params and ?payload=JSON. */
  if(r.status===405 && body.length<6000){
    try{
      const qs=toQuery(full) || ('payload='+encodeURIComponent(body));
      const r2=await fetch(API+(API.includes('?')?'&':'?')+qs,{method:'GET',redirect:'follow',signal:AbortSignal.timeout(FETCH_TIMEOUT)});
      const t2=await r2.text();
      if(t2){ r=r2; text=t2; }
    }catch(e){ /* keep the original 405 response for the error message below */ }
  }
  let j = null;
  try{ j = JSON.parse(text); }
  catch(e){
    const head = text.slice(0, 4000);
    if(/accounts\.google\.com|sign in to continue|ServiceLogin/i.test(head))
      throw new Error('The web app asked for a Google sign-in. Fix: Apps Script → Deploy → Manage deployments → ✏️ → set "Who has access" to "Anyone" → Deploy, then copy the new /exec URL into Admin → Settings.');
    if(r.status===405)
      throw new Error('HTTP 405 — the deployed script refused the request. Fix: paste the latest Code.gs in Apps Script, then Deploy → Manage deployments → ✏️ → Version "New version" → Deploy, and copy the Web app /exec URL (NOT the "Library" URL) into Admin → Settings.');
    if(r.status >= 400 || /Service Unavailable|scripts\.google\.com/i.test(head))
      throw new Error('Apps Script returned HTTP ' + r.status + '. Fix: Deploy → Manage deployments → ✏️ → "New version" → Deploy, and copy the /exec URL again.');
    throw new Error('Backend returned a web page instead of data — the saved URL is probably wrong. Use the Web app /exec URL from Deploy → Manage deployments (not the Library URL).');
  }
  if(!j.ok){
    if(/Not authorised/i.test(j.error||'')){ // session expired / passcode changed
      sessionStorage.removeItem('mv_tok'); localStorage.removeItem('mv_tok');
      toast('Session expired — sign in again','err'); setTimeout(()=>location.reload(),800);
    }
    throw new Error(j.error||'API error');
  }
  return j.data;
}
let __actionGen=0;   // bumped by every reloadAndStay — a stale background refresh must never clobber newer edits
async function loadAll(gen){
  const results = await Promise.allSettled(ENTITIES.map(e=>api({action:'list',entity:e})));
  const failed = results.filter(x=>x.status==='rejected');
  if(failed.length === ENTITIES.length) throw failed[0].reason;   // backend totally unreachable → error card
  if(gen && gen!==__actionGen) return;                            // a newer action superseded this refresh
  ENTITIES.forEach((e,i)=>DB[e]=results[i].status==='fulfilled'?results[i].value:[]);
  try{ const o = await api({action:'getOptions'}); if(!gen || gen===__actionGen) DB.options = o; }catch(e){ DB.options = optionsDefaults(); }
}
/* ---- sheet-backed dropdown categories (Admin manages these) ---- */
const OPTION_CATS = ['company','materialType','source','paymentMode'];
const OPTION_LABELS = { company:'Company', materialType:'Material Type', source:'Source', paymentMode:'Payment Mode' };
function optionsDefaults(){ return { company:['MEGAVERKS','VENGREE'],
  materialType:['Sheet Metal','Fasteners','Electrical','Hardware','Consumables'],
  source:['Inhouse','Vendor'], paymentMode:['Cash','UPI','Bank Transfer','Cheque','Credit'] }; }
function catOptions(cat, cur){
  const opts = ((DB.options||{})[cat]) || (optionsDefaults()[cat]) || [];
  const list = opts.filter(Boolean);
  const has = cur != null && cur !== '' && !list.map(x=>String(x).toLowerCase()).includes(String(cur).toLowerCase());
  return (has?`<option value="${esc(cur)}" selected>${esc(cur)}</option>`:'') +
    list.map(o=>`<option value="${esc(o)}" ${String(o).toLowerCase()===String(cur||'').toLowerCase()?'selected':''}>${esc(o)}</option>`).join('') +
    `<option value="__new__">＋ New…</option>`;
}
function wireCatSelect(el, cat, onchange){
  if(!el) return;
  el.onchange = async e => {
    if(e.target.value === '__new__'){ const v = await addCatOption(cat); if(v == null){ e.target.value=''; if(onchange) onchange(''); return; }
      e.target.innerHTML = catOptions(cat, v); e.target.value = v; if(onchange) onchange(v); return; }
    if(onchange) onchange(e.target.value);
  };
}
async function addCatOption(cat){
  const o = modal('Add ' + (OPTION_LABELS[cat] || cat), `<p class="sub">Saved to the sheet — available in every ${esc(OPTION_LABELS[cat] || cat)} dropdown for the whole team.</p>
    <input id="nc_in" style="width:100%" placeholder="New option name">`,
    `<button class="btn o" onclick="this.closest('.overlay').remove()">Cancel</button><button class="btn" id="nc_go">Add</button>`);
  return await new Promise(res => {
    o.querySelector('#nc_go').onclick = async () => {
      const v = o.querySelector('#nc_in').value.trim(); if(!v) return;
      o.querySelector('#nc_go').disabled = true;
      try{
        const cur = ((DB.options||{})[cat]) || [];
        if(!cur.map(x=>String(x).toLowerCase()).includes(v.toLowerCase())) cur.push(v);
        DB.options = await api({action:'saveOptions', options: Object.assign({}, DB.options, {[cat]: cur})});
        o.remove(); toast('Added “' + v + '” to ' + (OPTION_LABELS[cat] || cat),'ok'); res(v);
      }catch(err){ o.querySelector('#nc_go').disabled=false; toast(err.message,'err'); res(null); }
    };
    o.querySelector('#nc_in').focus();
  });
}
/* ---- entity selects (vendors / products / customers) with inline "+ New" ---- */
const ENTITY_LABELS = { vendors:'Vendor', products:'Product', customers:'Customer' };
function entityOptionsHTML(kind, selId){
  const list = (DB[kind]||[]).slice().sort((a,b)=>String(a.name||'').localeCompare(String(b.name||'')));
  const cur = list.find(x=>Number(x.id)===Number(selId));
  return (cur?'':'<option value=""'+(selId?'':' selected')+'>— select —</option>') +
    list.map(x=>`<option value="${x.id}" ${Number(x.id)===Number(selId)?'selected':''}>${esc(x.name||('#'+x.id))}</option>`).join('') +
    `<option value="__new__">＋ New ${ENTITY_LABELS[kind]||kind}…</option>`;
}
function wireEntitySelect(el, kind, onchange){
  if(!el) return;
  el.onchange = async e => {
    if(e.target.value === '__new__'){ const rec = await quickCreateEntity(kind); if(!rec){ e.target.value=''; if(onchange) onchange(''); return; }
      e.target.innerHTML = entityOptionsHTML(kind, rec.id); e.target.value = rec.id; if(onchange) onchange(rec.id); return; }
    if(onchange) onchange(e.target.value);
  };
}
function quickCreateEntity(kind, preset){
  preset = preset || {};
  const fields = { vendors:[['name','Name *'],['phone','Phone'],['gstin','GSTIN'],['address','Address']],
    products:[['name','Name *'],['company','Company']],
    customers:[['name','Name *'],['contactPerson','Contact'],['phone','Phone'],['gstin','GSTIN']] }[kind] || [['name','Name *']];
  const o = modal('New ' + (ENTITY_LABELS[kind]||kind), `<div class="frow2">` +
      fields.map(f=>`<div><span class="lbl">${f[1]}</span><input id="qe_${f[0]}" style="width:100%" value="${esc(preset[f[0]]||'')}"></div>`).join('') + `</div>`,
    `<button class="btn o" onclick="this.closest('.overlay').remove()">Cancel</button><button class="btn" id="qe_go">Create</button>`);
  return new Promise(res => {
    o.querySelector('#qe_go').onclick = async () => {
      const rec = {}; fields.forEach(f=>rec[f[0]] = o.querySelector('#qe_'+f[0]).value.trim());
      if(!rec.name){ toast('Name required','err'); return; }
      o.querySelector('#qe_go').disabled = true;
      try{ const saved = await api({action:'create', entity: kind, record: rec});
        DB[kind].push(saved); o.remove(); toast((ENTITY_LABELS[kind]||kind)+' created','ok'); res(saved);
      }catch(err){ o.querySelector('#qe_go').disabled=false; toast(err.message,'err'); res(null); }
    };
    o.querySelector('#qe_name') && o.querySelector('#qe_name').focus();
  });
}

/* ---------- passcode gate ---------- */
function showLock(){
  return new Promise(resolve=>{
    const d=document.createElement('div'); d.className='lock';
    d.innerHTML=`<div class="lockbox">
      <div class="logo">M</div>
      <h2>MEGAVERKS Inventory V10</h2>
      <p>Enter the passcode to continue</p>
      <input id="lk_pass" type="password" placeholder="••••••••" autocomplete="current-password">
      <div class="lockerr" id="lk_err"></div>
      <label class="remember"><input type="checkbox" id="lk_rem"> Keep me signed in on this device</label>
      <button class="btn" style="width:100%" id="lk_go">Unlock</button>
      ${API_UNSET?`<p style="margin-top:12px"><a href="#admin" id="lk_setup" style="font-size:12px;color:#6366f1">First time? Set up the backend connection →</a></p>`:''}</div>`;
    document.body.appendChild(d);
    const go=async()=>{
      const btn=$('#lk_go'); btn.disabled=true; $('#lk_err').textContent='';
      if(API_UNSET){ $('#lk_err').textContent='No backend URL saved yet — click "Set up the backend connection" below.'; btn.disabled=false; return; }
      try{
        const res=await api({action:'verify',passcode:$('#lk_pass').value});
        if(res.valid){
          if($('#lk_rem').checked) localStorage.setItem('mv_tok',res.token);
          else sessionStorage.setItem('mv_tok',res.token);
          d.remove(); resolve(true); return;
        }
        $('#lk_err').textContent='Wrong passcode — try again';
      }catch(e){ $('#lk_err').textContent=e.message; }
      btn.disabled=false;
    };
    $('#lk_go').onclick=go;
    $('#lk_pass').onkeydown=e=>{ if(e.key==='Enter') go(); };
    const setup=$('#lk_setup');
    if(setup) setup.onclick=e=>{ e.preventDefault(); d.remove(); resolve(false); };
    setTimeout(()=>$('#lk_pass').focus(),100);
  });
}
async function gate(){
  if(token()) return true;               // already have a (day) token
  return showLock();                     // blocks until unlocked
}
function logout(){
  sessionStorage.removeItem('mv_tok'); localStorage.removeItem('mv_tok');
  location.reload();
}

/* ================= UI helpers ================= */
function toast(msg,type){ const t=document.createElement('div'); t.className='toast '+(type||''); t.textContent=msg;
  $('#toasts').appendChild(t); setTimeout(()=>t.remove(), type==='err'?6000:3200); }
function modal(title, body, foot){
  const o=document.createElement('div'); o.className='overlay';
  o.innerHTML=`<div class="modal"><h3>${title}</h3>${body}<div class="mfoot">${foot||''}</div></div>`;
  o.onclick=e=>{ if(e.target===o) o.remove(); }; document.body.appendChild(o); return o;
}
/* ---------- help / procedure guide ---------- */
function showHelp(){
  const o=modal('❓ How to use MEGAVERKS Inventory',`<div class="helpbox" style="max-height:65vh;overflow:auto;padding-right:6px">
  <h4>1 · First-time setup (once, ~5 minutes)</h4>
  <ol>
    <li>Open the app → enter passcode <b>mega1234</b> → Unlock.</li>
    <li>Go to <b>🛡️ Admin</b> → the backend URL is already pre-filled → click <b>Test Connection</b> (should say <i>Connected — V10-sheets-fixed</i>).</li>
    <li>Click <b>Create/Verify Sheet Tabs</b> — this builds all 13 tabs in your Google Sheet automatically.</li>
    <li>Click <b>🧪 Run Backend Self-Test</b> — expect <b>8/8 ✅</b>. If the last check warns about a permission, run the <code>checkAuthorization</code> function once in the Apps Script editor (Run ▶ → Allow).</li>
    <li>Change the passcode in <b>Admin → Change Passcode</b> so only your team can enter.</li>
    <li>Optional: paste a <b>Hugging Face token</b> in Admin if you want bill OCR.</li>
    <li>Click <b>Set your name</b> (top bar) — your name is stamped on every change in the audit log.</li>
  </ol>

/* ================= IMAGES (Google Drive) ================= */
function fileToDataUrl(file,maxW,q){ return new Promise((res,rej)=>{ const rd=new FileReader();
  rd.onload=()=>{ const img=new Image(); img.onload=()=>{ let w=img.width,h=img.height;
    const s=Math.min(1,(maxW||1200)/w); const c=document.createElement('canvas');
    c.width=Math.round(w*s); c.height=Math.round(h*s); c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    res(c.toDataURL('image/jpeg',q||0.75)); }; img.onerror=()=>rej(new Error('Invalid image'));
    img.src=String(rd.result); }; rd.onerror=()=>rej(new Error('Read failed')); rd.readAsDataURL(file); }); }
/* upload to the Drive folder via the script; only the returned link is stored in the sheet */
async function driveUpload(file){
  const dataUrl=await fileToDataUrl(file,1200,0.75);
  const r=await api({action:'uploadImage',name:file.name||'image.jpg',dataUrl:dataUrl});
  return r;
}
function isImgUrl(v){ return v && !/^data:/.test(v); }
/* Drive images: try lh3 → drive thumbnail → uc?export=view, then show a warning chip */
function driveImgId(u){ const m=String(u||'').match(/\/d\/([-\w]{20,})/); return m?m[1]:null; }
function imgErr(el,id){
  const step=+(el.dataset.fb||0)+1; el.dataset.fb=step;
  if(step===1) el.src='https://drive.google.com/thumbnail?id='+id+'&sz=w400';
  else if(step===2) el.src='https://drive.google.com/uc?export=view&id='+id;
  else imgProxy(el,id);
}
/* final fallback: pull the image through our own backend (runs as the owner,
   so it displays even when Google blocks public link sharing entirely) */
async function imgProxy(el,id){
  try{
    const r=await api({action:'image', id:id});
    if(r && r.data){ el.onerror=null; el.src='data:'+(r.mime||'image/jpeg')+';base64,'+r.data; return; }
  }catch(e){}
  el.onerror=null;
  el.outerHTML='<div class="ic" style="width:40px;height:40px;background:#fee2e2;color:#dc2626" title="Image preview blocked — open Admin → Self-Test to verify Drive, or click ⤴ Replace to re-upload">⚠</div>';
}
function isRepoImg(u){ return /^(\.\/)?images\//.test(String(u||'')); }
/* ---- repo image pool: photos stored in the GitHub repo next to index.html ----
   Served by GitHub Pages from the SAME origin as the app, so they always
   display — no Drive, no sharing restrictions. */
let _imgPool=null;
function repoSlug(){
  const m=location.hostname.match(/^([^.]+)\.github\.io$/);
  const seg=location.pathname.split('/').filter(Boolean)[0]||'';
  return (m&&seg)?{owner:m[1],repo:seg}:null;
}
async function loadImgPool(){
  if(_imgPool) return _imgPool;
  let list=[];
  const slug=repoSlug();
  if(slug){   // auto-list images/ via the public GitHub API (no token needed)
    try{
      const r=await fetch(`https://api.github.com/repos/${slug.owner}/${slug.repo}/contents/images`,{headers:{'Accept':'application/vnd.github+json'}});
      if(r.ok){ const j=await r.json();
        if(Array.isArray(j)) list=j.filter(f=>/\.(png|jpe?g|gif|webp|svg)$/i.test(f.name||'')).map(f=>'images/'+f.name); }
    }catch(e){}
  }
  if(!list.length){   // fallback: images/manifest.json (array of paths)
    try{ const r=await fetch('images/manifest.json');
      if(r.ok){ const j=await r.json();
        if(Array.isArray(j)) list=j.map(x=>typeof x==='string'?x:(x&&x.file)).filter(Boolean); } }catch(e){}
  }
  _imgPool=list; return list;
}

/* ================= CSV ================= */
function parseCSV(text){
  const rows=[]; let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){ const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else if(c==='"') q=true;
    else if(c===','){ row.push(cur); cur=''; }
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(cur); rows.push(row); row=[]; cur=''; }
    else cur+=c; }
  if(cur!==''||row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r=>r.some(c=>String(c).trim()!==''));
}
function toCSV(rows){ return rows.map(r=>r.map(c=>{ c=String(c==null?'':c);
  return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c; }).join(',')).join('\n'); }
function download(name,text,mime){ const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([text],{type:mime||'text/csv'})); a.download=name; a.click(); }
const normH = s => String(s||'').trim().toLowerCase().replace(/\(.*?\)/g,'').replace(/[^a-z0-9]+/g,' ').trim();
function mapHeaders(headerRow, aliasMap){
  const map={};
  headerRow.forEach((h,idx)=>{ const n=normH(h);
    for(const key in aliasMap) if(aliasMap[key].some(a=>normH(a)===n)){ map[key]=idx; break; } });
  return map;
}

function reloadAndStay(msg,type,quick){
  const gen=++__actionGen;
  if(typeof quick==='function'){ try{ quick(); }catch(e){} }        // apply the change locally → visible instantly
  syncStamp(); route(); if(msg) toast(msg,type||'ok');
  loadAll(gen).then(()=>{ if(gen!==__actionGen) return; if(!document.querySelector('.overlay') && !document.querySelector('.lock')) route(); syncStamp(); }).catch(()=>{}); // reconcile with the sheet in the background
  return Promise.resolve();
}

/* ---------- automatic cloud sync ---------- */
let _syncT=null;
function syncStamp(){ const t=$('#syncTag'); if(t) t.textContent='Synced '+new Date().toLocaleTimeString(); }
function startAutoSync(){
  clearInterval(_syncT);
  _syncT=setInterval(async()=>{
    if(document.querySelector('.overlay') || document.querySelector('.lock')) return; // don't clobber open dialogs
    const before=JSON.stringify(DB);
    try{ await loadAll(); }catch(e){ const t=$('#syncTag'); if(t) t.textContent='⚠ offline'; return; }
    if(JSON.stringify(DB)!==before){ syncStamp(); route(); toast('New data synced from the cloud','ok'); }
    else syncStamp();
  }, 45000);
  window.addEventListener('focus',()=>{ if(document.querySelector('.overlay')||document.querySelector('.lock')) return;
    loadAll().then(syncStamp).catch(()=>{}); });   // pull latest whenever the tab is brought back
}

async function saveItem(){
  const id=$('#f_id').value, name=$('#f_name').value.trim(); if(!name) return toast('Item name required','err');
  const ven=$('#f_ven'); const srcRaw=$('#f_src').value;
  const srcNorm=/in-?house/i.test(srcRaw)?'inhouse':(/vendor/i.test(srcRaw)?'vendor':String(srcRaw||'').toLowerCase());
  const rec={ name, partNumber:$('#f_pn').value.trim(), company:$('#f_co').value,
    source:srcNorm, vendorId:(ven.value&&ven.value!=='__new__')?ven.value:'', vendorName:(ven.value&&ven.value!=='__new__'&&ven.selectedIndex>=0)?(ven.options[ven.selectedIndex].text):'',
    materialType:$('#f_mt').value.trim(), price:$('#f_pr').value||'', moq:$('#f_moq').value.trim(),
    leadTime:$('#f_lt').value.trim(), productId:[...document.querySelectorAll('#f_prods input:checked')].map(x=>x.value).join(','), minStock:$('#f_min').value||0,
    instructions:$('#f_ins').value, imageData:document.querySelector('.overlay').dataset.img||'' };
  try{ $('#fSave').disabled=true;
    let saved;
    if(id){ rec.id=id; const old=item(id); Object.assign(rec,{stockInput:old.stockInput,stockOutput:old.stockOutput,stockInHand:old.stockInHand,createdAt:old.createdAt});
      saved=await api({action:'update',entity:'items',record:rec}); }
    else saved=await api({action:'create',entity:'items',record:rec});
    // multi-vendor price list sync
    const itemId=saved.id; const ovl=document.querySelector('.overlay');
    for(const r of [...document.querySelectorAll('#f_ivl > div')]){
      if(r.dataset.ivid){ const pr=r.querySelector('input[type=number]').value;
        const old=DB.itemVendors.find(x=>Number(x.id)===Number(r.dataset.ivid));
        if(old&&Number(old.price)!==Number(pr)){ old.price=Number(pr)||0;
          const sv=await api({action:'update',entity:'itemVendors',record:old}); localUpsert('itemVendors',sv); } }
      else { const sel=r.querySelector('select'); const pr=r.querySelector('input[type=number]').value;
        if(sel&&sel.value&&Number(pr)>0){ const v=vendor(sel.value)||{};
          const sv=await api({action:'create',entity:'itemVendors',record:{itemId:itemId,vendorId:sel.value,vendorName:v.name||'',price:Number(pr)}});
          DB.itemVendors.push(sv); } } }
    for(const ivid of String((ovl&&ovl.dataset.ivdel)||'').split(',').filter(Boolean)){
      await api({action:'remove',entity:'itemVendors',id:ivid}); DB.itemVendors=DB.itemVendors.filter(x=>Number(x.id)!==Number(ivid)); }
    document.querySelector('.overlay').remove(); reloadAndStay(id?'Item updated':'Item added','ok',()=>localUpsert('items',saved));
  }catch(e){ $('#fSave').disabled=false; toast(e.message,'err'); }
}

function vendorStats(v){
  const invs=DB.invoices.filter(i=>Number(i.vendorId)===Number(v.id));
  const pays=DB.payments.filter(p=>Number(p.vendorId)===Number(v.id));
  const totInv=invs.reduce((s,i)=>s+Number(i.total||0),0);
  const totPaid=pays.reduce((s,p)=>s+Number(p.amount||0),0);
  const last=pays.map(p=>p.paymentDate).sort().pop()||null;
  return {invoiceCount:invs.length,totalInvoiced:totInv,totalPaid:totPaid,balance:totInv-totPaid,lastPaymentDate:last}; }

function billCalc(d){
  const sub=d.lines.reduce((s,l)=>s+Number(l.qty||0)*Number(l.rate||0),0);
  const taxType=d.taxType||'NONE', gstRate=Number(d.gstRate||0);
  const taxAmt=taxType==='NONE'?0:(taxType==='GST_INCL'?sub*gstRate/(100+gstRate):sub*gstRate/100);
  const total=taxType==='GST_INCL'?sub:sub+taxAmt;
  return {sub:+sub.toFixed(2), taxAmt:+taxAmt.toFixed(2), total:+total.toFixed(2), taxType, gstRate};
}

function updateBillTotals(){
  const d=billDraft, c=billCalc(d);
  d.taxType=c.taxType; d.gstRate=c.gstRate;
  d.subtotal=c.sub; d.taxAmount=c.taxAmt; d.total=c.total;
  d.lines.forEach((l,ix)=>{ const n=document.getElementById('b_amt_'+ix); if(n) n.textContent=inr(Number(l.qty||0)*Number(l.rate||0)); });
  const t=$('#b_total'); if(t) t.textContent=inr(c.total);
}

async function runOcr(){ const f=billDraft&&billDraft._ocrFile; if(!f) return toast('Choose an invoice image in the OCR field first','err');
  const st=$('#b_ocrst'); st.textContent='Reading invoice…'; st.style.color='';
  try{
    const dataUrl=await fileToDataUrl(f,1600,0.85);
    const r=await api({action:'ocr',image:dataUrl});
    const txt=String(r.text||'').trim(); const fld=r.fields||{};
    if(!txt && !fld.invoiceNumber && !fld.gstin) throw new Error('OCR returned no readable text — try a clearer, straight-on photo of the bill.');
    if(fld.invoiceNumber && !$('#b_no').value.trim()){ $('#b_no').value=fld.invoiceNumber; billDraft.invoiceNumber=fld.invoiceNumber; }
    if(fld.invoiceDate){ $('#b_dt').value=fld.invoiceDate; billDraft.invoiceDate=fld.invoiceDate; }
    if(fld.grandTotal){ billDraft._ocrTotal=fld.grandTotal; const tt=$('#b_total'); if(tt) tt.title='OCR grand total: '+fld.grandTotal; }
    const nb=$('#b_notes'); const bits=[];
    if(fld.vendor) bits.push('Vendor (OCR): '+fld.vendor);
    if(fld.gstin) bits.push('GSTIN: '+fld.gstin);
    if(fld.address) bits.push('Address: '+fld.address);
    if(fld.phone) bits.push('Phone: '+fld.phone);
    if(fld.invoiceNumber) bits.push('Invoice No: '+fld.invoiceNumber);
    if(fld.invoiceDate) bits.push('Invoice Date: '+fld.invoiceDate);
    if(fld.grandTotal) bits.push('Grand Total: '+fld.grandTotal);
    if(txt) bits.push('', '--- full OCR text ---', txt.slice(0,4000));
    nb.value=(bits.join('\n')).slice(0,6000); billDraft.notes=nb.value;
    billDraft._ocrFields=fld;
    st.textContent='✓ Extracted: '+(fld.vendor||'vendor')+(fld.invoiceNumber?(' · '+fld.invoiceNumber):'')+(fld.grandTotal?(' · ₹'+fld.grandTotal):'');
    st.style.color='#059669';
    refreshNewVendorChip();
    toast('Invoice details extracted — review and Save','ok');
  }catch(e){ st.textContent='OCR failed: '+e.message; st.style.color='#dc2626'; toast(e.message,'err'); } }
function refreshNewVendorChip(){ const el=$('#b_newven'); if(!el) return; const d=billDraft||{};
  const fld=d._ocrFields||{}; if(!fld.vendor && !fld.gstin){ el.innerHTML=''; d._newVendor=null; return; }
  const cur=(DB.vendors||[]).find(v=>(fld.gstin && String(v.gstin||'').toLowerCase()===String(fld.gstin).toLowerCase())
    || String(v.name||'').trim().toLowerCase()===String(fld.vendor||'').trim().toLowerCase());
  if(cur){ d._newVendor=null;
    if(d.vendorId!==cur.id){ d.vendorId=cur.id; const vs=$('#b_ven'); if(vs) vs.value=cur.id; }
    const miss=[]; if(fld.gstin&&!cur.gstin)miss.push('GSTIN'); if(fld.address&&!cur.address)miss.push('address'); if(fld.phone&&!cur.phone)miss.push('phone');
    el.innerHTML=miss.length?`<div class="note" style="border-color:#2563eb;background:#eff6ff;font-size:12px">ℹ️ Matched existing vendor “${esc(cur.name)}” — ${miss.join(', ')} from the invoice will be added on Save.</div>`:'';
    d._patchVendor=miss.length?{id:cur.id,gstin:fld.gstin||cur.gstin,address:fld.address||cur.address,phone:fld.phone||cur.phone}:null;
    return; }
  d._newVendor={ name:fld.vendor||'New Vendor', gstin:fld.gstin||'', address:fld.address||'', phone:fld.phone||'', creditDays:30 };
  el.innerHTML=`<div class="note" style="border-color:#059669;background:#ecfdf5;font-size:12px">🆕 New vendor “${esc(fld.vendor||'—')}”${fld.gstin?(' ('+esc(fld.gstin)+')'):''} will be <b>added to the Vendor List</b> when you Save this bill.</div>`; }
async function saveBill(){ const d=billDraft; d.vendorId=$('#b_ven').value; d.invoiceNumber=$('#b_no').value.trim();
  d.invoiceDate=$('#b_dt').value; d.paymentMode=$('#b_pm').value; d.notes=$('#b_notes').value;
  d.creditDays=$('#b_cd').value||30; d.advancePaid=$('#b_adv').value||0;
  if(d.vendorId==='__new__') d.vendorId='';
  /* brand-new vendor from OCR → create it first, then bill against it */
  if(!d.vendorId && d._newVendor && d._newVendor.name){
    try{ $('#bSave').disabled=true;
      const v=await api({action:'create',entity:'vendors',record:d._newVendor});
      DB.vendors.push(v); d.vendorId=v.id; $('#bSave').disabled=false;
    }catch(e){ $('#bSave').disabled=false; return renderBillDlg('Vendor auto-create failed: '+e.message); } }
  if(!d.vendorId) return renderBillDlg('Select a vendor');
  if(!d.invoiceNumber) return renderBillDlg('Invoice number required');
  d.lines=d.lines.filter(l=>l.description.trim());
  if(!d.lines.length) return renderBillDlg('Add at least one line item');
  const due=new Date(d.invoiceDate||today()); due.setDate(due.getDate()+Number(d.creditDays||30));
  try{ $('#bSave').disabled=true;
    /* matched vendor missing GSTIN/address/phone → backfill from the invoice */
    if(d._patchVendor && d._patchVendor.id){
      const old=vendor(d._patchVendor.id);
      if(old){ const patch=Object.assign({},old); ['gstin','address','phone'].forEach(k=>{ if(!patch[k]&&d._patchVendor[k]) patch[k]=d._patchVendor[k]; });
        const savedV=await api({action:'update',entity:'vendors',record:patch}); localUpsert('vendors',savedV); } }
    const vend=vendor(d.vendorId)||{};
    /* invoice photo → Drive “Purchases” folder, named VENDOR_INVOICEDATE */
    let att=d.attachmentData||'', attName=d.attachmentName||'';
    if(d._attFile){ try{ const dataUrl=await fileToDataUrl(d._attFile,1600,0.8);
        const up=await api({action:'uploadPurchase',dataUrl:dataUrl,vendorName:vend.name||'VENDOR',invoiceDate:d.invoiceDate||today()});
        att=up.url; attName=up.name; }catch(e){ toast('Bill saved, but photo upload failed: '+e.message,'err'); } }
    const savedBill=await api({action:'create',entity:'invoices',record:{vendorId:d.vendorId,invoiceNumber:d.invoiceNumber,invoiceDate:d.invoiceDate,
      subtotal:d.subtotal,taxType:d.taxType,gstRate:d.gstRate||0,taxAmount:d.taxAmount,total:d.total,paymentMode:d.paymentMode,
      advancePaid:d.advancePaid||0,creditDays:d.creditDays,dueDate:due.toISOString().slice(0,10),lineItems:JSON.stringify(d.lines),
      attachmentData:att,attachmentName:attName,notes:d.notes||''}});
    document.querySelector('.overlay').remove(); reloadAndStay('Bill saved','ok',()=>localUpsert('invoices',savedBill)); }catch(e){ $('#bSave').disabled=false; toast(e.message,'err'); } }

let poDraft=null;
let poQuery='';
function poGroups(){
  const m={};
  DB.pos.forEach(p=>{ const k=(String(p.poNumber||'').trim().toUpperCase())||('ID:'+p.id);
    if(!m[k]) m[k]={key:k,poNumber:p.poNumber||'\u2014',records:[]};
    m[k].records.push(p); });
  return Object.values(m).map(g=>{
    g.records.sort((a,b)=>Number(a.id)-Number(b.id));
    const primary=g.records[g.records.length-1];
    g.customerId=primary.customerId;
    g.customerName=(customer(primary.customerId)||{}).name||primary.customerName||'\u2014';
    g.poDate=primary.poDate||'';
    g.ids=g.records.map(r=>r.id);
    const active=g.records.filter(r=>r.status!=='CANCELLED');
    const actIds=(active.length?active:g.records).map(r=>r.id);
    g.lines=DB.poLines.filter(l=>actIds.some(id=>Number(id)===Number(l.poId)));
    g.dispatches=DB.dispatches.filter(d=>actIds.some(id=>Number(id)===Number(d.poId)));
    g.tot=g.lines.reduce((sum,l)=>sum+Number(l.qty||0),0);
    g.dsp=g.lines.reduce((sum,l)=>sum+poDispatched(l.poId,l.productId),0);
    g.pct=g.tot?Math.round(g.dsp*100/g.tot):0;
    if(active.length===0) g.status='CANCELLED';
    else if(g.tot>0&&g.dsp>=g.tot) g.status='DISPATCHED';
    else if(g.dsp>0) g.status='PARTIAL';
    else g.status='OPEN';
    return g; }); }
function poDispatched(poId, productId){
  return DB.dispatches.filter(d=>Number(d.poId)===Number(poId)&&Number(d.productId)===Number(productId))
    .reduce((s,d)=>s+Number(d.qty||0),0); }
function poBalance(l){ return Math.max(0, Number(l.qty||0)-poDispatched(l.poId,l.productId)); }
function poProgress(p){ const lines=DB.poLines.filter(l=>Number(l.poId)===Number(p.id));
  const tot=lines.reduce((s,l)=>s+Number(l.qty||0),0);
  const dsp=lines.reduce((s,l)=>s+poDispatched(l.poId,l.productId),0);
  return {tot,dsp,pct:tot?Math.round(dsp*100/tot):0}; }

function poRequirements(p,lines){ lines=lines||DB.poLines.filter(l=>Number(l.poId)===Number(p.id));
  const req={}; let noBom=true;
  lines.forEach(l=>{ DB.bom.filter(b=>Number(b.productId)===Number(l.productId)).forEach(b=>{ noBom=false;
    req[b.itemId]=(req[b.itemId]||0)+Number(b.qtyPer)*Number(l.qty); }); });
  if(noBom) return `<p class="mut">No BOM defined for these products — define it in Products to check material position.</p>`;
  const ids=Object.keys(req); const ok=ids.every(iid=>(Number((item(iid)||{}).stockInHand)||0)>=req[iid]);
  return `<p>${ok?'<span class="badge g">SUFFICIENT STOCK</span>':'<span class="badge rd">INSUFFICIENT</span>'}</p>
  <table style="margin-top:8px"><thead><tr><th>Item</th><th class="r">Required</th><th class="r">In Hand</th><th class="r">Gap</th></tr></thead><tbody>
  ${ids.map(iid=>{ const it=item(iid)||{}; const gap=(Number(it.stockInHand)||0)-req[iid];
    return `<tr><td>${esc(it.name||'?')}</td><td class="r">${req[iid]}</td><td class="r">${it.stockInHand||0}</td>
    <td class="r" style="color:${gap<0?'#dc2626':'#059669'};font-weight:700">${gap<0?gap:'+'+gap}</td></tr>`; }).join('')}</tbody></table>`; }

async function savePo(){ const d=poDraft; d.poNumber=$('#po_no').value.trim(); d.customerId=$('#po_cust').value;
  if(!d.poNumber) return renderPoDlg('PO number required'); if(!d.customerId) return renderPoDlg('Select a customer');
  d.lines=d.lines.filter(l=>l.productId&&Number(l.qty)>0); if(!d.lines.length) return renderPoDlg('Add at least one line with product & qty');
  const editIds=d.editIds||[];
  if(DB.pos.some(p=>!editIds.some(id=>Number(id)===Number(p.id))&&String(p.poNumber).trim().toLowerCase()===d.poNumber.toLowerCase())) return renderPoDlg('PO number already exists');
  try{ $('#poSave').disabled=true;
    if(editIds.length){
      const primaryId=editIds[editIds.length-1];
      for(const l of d.lines){
        if(l.id){ const oldL=DB.poLines.find(x=>Number(x.id)===Number(l.id))||{};
          const saved=await api({action:'update',entity:'poLines',record:{...oldL,customerPartName:l.customerPartName,
            customerPartNumber:l.customerPartNumber,productId:l.productId,qty:l.qty}});
          const ix=DB.poLines.findIndex(x=>Number(x.id)===Number(l.id)); if(ix>=0) DB.poLines[ix]=saved; }
        else { const saved=await api({action:'create',entity:'poLines',record:{poId:l.poId||primaryId,customerPartName:l.customerPartName,
            customerPartNumber:l.customerPartNumber,productId:l.productId,qty:l.qty}});
          DB.poLines.push(saved); } }
      for(const lid of (d.delLineIds||[])){ await api({action:'remove',entity:'poLines',id:lid});
        DB.poLines=DB.poLines.filter(x=>Number(x.id)!==Number(lid)); }
      for(const id of editIds){ const p=DB.pos.find(x=>Number(x.id)===Number(id)); if(!p) continue;
        p.poNumber=d.poNumber; p.poDate=d.poDate||today(); p.customerId=d.customerId; p.notes=$('#po_notes').value;
        if(p.status!=='CANCELLED'){ const ls=DB.poLines.filter(l=>Number(l.poId)===Number(id));
          const t=ls.reduce((sum,l)=>sum+Number(l.qty||0),0);
          const ds=ls.reduce((sum,l)=>sum+poDispatched(l.poId,l.productId),0);
          p.status=(t>0&&ds>=t)?'DISPATCHED':(ds>0?'PARTIAL':'OPEN'); }
        const saved=await api({action:'update',entity:'pos',record:p}); localUpsert('pos',saved); }
      document.querySelectorAll('.overlay.po_dlg').forEach(o=>o.remove()); reloadAndStay('PO updated','ok');
    } else {
      const po=await api({action:'create',entity:'pos',record:{customerId:d.customerId,poNumber:d.poNumber,poDate:d.poDate||today(),
        status:'OPEN',notes:$('#po_notes').value,dispatchedBy:'',dispatchedAt:''}});
      for(const l of d.lines) await api({action:'create',entity:'poLines',record:{poId:po.id,customerPartName:l.customerPartName,
        customerPartNumber:l.customerPartNumber,productId:l.productId,qty:l.qty}});
      document.querySelectorAll('.overlay.po_dlg').forEach(o=>o.remove()); reloadAndStay('PO created','ok',()=>{ localUpsert('pos',po);
        d.lines.forEach((l,ix)=>DB.poLines.push({id:'tmp-'+po.id+'-'+ix,poId:po.id,customerPartName:l.customerPartName,
          customerPartNumber:l.customerPartNumber,productId:l.productId,qty:l.qty})); }); }
    }catch(e){ if($('#poSave')) $('#poSave').disabled=false; toast(e.message,'err'); } }

        const sl=await api({action:'create',entity:'vendorPoLines',record:{vpoId:po.id,itemId:l.itemId,itemName:it.name||'',

function sheetXml(rows){ const col=i=>'ABCDEFGH'[i]||'A';

function _crcTable(){ if(window.__crcT) return window.__crcT; const t=new Uint32Array(256);
  for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1); t[n]=c>>>0; }

function zipStore(files){ const enc=new TextEncoder(); const chunks=[], central=[]; let offset=0;
  files.forEach(f=>{ const name=enc.encode(f.name); const data=enc.encode(f.text); const crc=crc32(data);
    const h=new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true); h.setUint16(4,20,true); h.setUint16(6,0,true); h.setUint16(8,0,true);
    h.setUint16(10,0,true); h.setUint16(12,0,true); h.setUint32(14,crc,true);
    h.setUint32(18,data.length,true); h.setUint32(22,data.length,true);
    h.setUint16(26,name.length,true); h.setUint16(28,0,true);
    chunks.push(new Uint8Array(h.buffer),name,data);
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true); ch.setUint16(4,20,true); ch.setUint16(6,20,true);
    ch.setUint16(8,0,true); ch.setUint16(10,0,true); ch.setUint16(12,0,true); ch.setUint16(14,0,true);
    ch.setUint32(16,crc,true); ch.setUint32(20,data.length,true); ch.setUint32(24,data.length,true);
    ch.setUint16(28,name.length,true); ch.setUint16(30,0,true); ch.setUint16(32,0,true);
    ch.setUint16(34,0,true); ch.setUint16(36,0,true); ch.setUint32(38,0,true); ch.setUint32(42,offset,true);
    central.push(new Uint8Array(ch.buffer),name);
    offset+=30+name.length+data.length; });
  const cdSize=central.reduce((sum,c)=>sum+c.length,0);
  const e=new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true); e.setUint16(8,files.length,true); e.setUint16(10,files.length,true);
  e.setUint32(12,cdSize,true); e.setUint32(16,offset,true);
  return new Blob(chunks.concat(central,[new Uint8Array(e.buffer)]),{type:'application/zip'}); }
function xlsxBlob(rows){ return zipStore([

  {name:'xl/workbook.xml',text:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="Purchase Order" sheetId="1" r:id="rId1"/></sheets></workbook>'},
  {name:'xl/_rels/workbook.xml.rels',text:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/></Relationships>'},

function rmSparkline(ms){ const w=260,h=56,pad=6;
  const ps=ms.map(m=>Number(m.pricePerKg)); const min=Math.min(...ps),max=Math.max(...ps);
  const rng=(max-min)||1; const n=ms.length;
  const pts=ms.map((m,i)=>{ const x=n===1?w/2:pad+i*(w-2*pad)/(n-1);
    const y=h-pad-((Number(m.pricePerKg)-min)/rng)*(h-2*pad); return x.toFixed(1)+','+y.toFixed(1); });
  return `<svg width="${w}" height="${h}" style="background:#f8fafc;border-radius:6px;margin-top:6px" role="img">
    <polyline points="${pts.join(' ')}" fill="none" stroke="#2563eb" stroke-width="2"/>
    ${pts.map(p=>{ const xy=p.split(','); return `<circle cx="${xy[0]}" cy="${xy[1]}" r="3" fill="#2563eb"/>`; }).join('')}</svg>`; }
function rmTrendsHTML(){
  const g={};
  DB.rmMoves.filter(m=>m.type==='IN'&&Number(m.pricePerKg)>0).forEach(m=>{
    const r=DB.rawMaterials.find(x=>Number(x.id)===Number(m.rmId));
    const key=r?rmName(r):'—';
    (g[key]=g[key]||[]).push(m); });
  const keys=Object.keys(g);
  if(!keys.length) return `<div class="card mut" style="text-align:center;padding:20px;margin-top:14px">No procurement prices yet — receive material with a ₹/kg price to see price trends here.</div>`;
  return `<div class="card" style="margin-top:14px"><div style="padding:14px 14px 4px;font-weight:700;color:#1d4ed8">📈 Procurement Price Trends (₹ per kg)</div>
  <div style="padding:6px 14px 14px;display:flex;flex-wrap:wrap;gap:16px">
  ${keys.map(k=>{ const ms=g[k].slice().sort((a,b)=>String(a.date).localeCompare(String(b.date)));
    const prices=ms.map(m=>Number(m.pricePerKg));
    const min=Math.min(...prices), max=Math.max(...prices);
    const first=prices[0], last=prices[prices.length-1];
    const change=first?Math.round((last-first)/first*1000)/10:0;
    return `<div style="flex:1;min-width:280px;border:1px solid var(--line,#e2e8f0);border-radius:8px;padding:10px 12px">
      <div class="b" style="font-size:13px">${esc(k)}</div>
      ${rmSparkline(ms)}
      <div style="font-size:12px;margin-top:4px">Latest <b>${inr(last)}/kg</b> · min ${inr(min)} · max ${inr(max)} ·
        <span style="color:${change>0?'#dc2626':change<0?'#059669':'#6b7280'};font-weight:700">${change>0?'▲ +':(change<0?'▼ ':'')}${change}%</span> since ${esc(ms[0].date||'')}</div>
      <div class="tblwrap" style="margin-top:6px"><table><thead><tr><th>Date</th><th>Vendor</th><th>Invoice</th><th class="r">Sheets</th><th class="r">₹/kg</th></tr></thead><tbody>
      ${ms.map(m=>`<tr><td>${esc(m.date||'')}</td><td>${esc(m.vendorName||'—')}</td><td class="mut">${esc(m.invoiceNumber||'—')}</td><td class="r">${m.qty}</td><td class="r b">${inr(m.pricePerKg)}</td></tr>`).join('')}
      </tbody></table></div></div>`; }).join('')}
  </div></div>`; }

/* ================= ANALYSIS ================= */
let deadDays=90;
function computeAnalysis(){
  const openPos=DB.pos.filter(p=>p.status==='OPEN'||p.status==='PARTIAL');
  const bomByProd={}; DB.bom.forEach(b=>{(bomByProd[b.productId]=bomByProd[b.productId]||[]).push(b);});
  const required={}; const poRows=openPos.map(po=>{
    let totalQty=0; const poReq={};
    DB.poLines.filter(l=>Number(l.poId)===Number(po.id)).forEach(l=>{ const bal=poBalance(l); totalQty+=bal;
      (bomByProd[l.productId]||[]).forEach(b=>{ const need=Number(b.qtyPer)*bal;
        poReq[b.itemId]=(poReq[b.itemId]||0)+need; required[b.itemId]=(required[b.itemId]||0)+need; }); });
    let shortageUnits=0;
    for(const iid in poReq){ const onHand=Number((item(iid)||{}).stockInHand)||0;
      if(poReq[iid]>onHand) shortageUnits+=poReq[iid]-onHand; }
    return {id:po.id,poNumber:po.poNumber,poDate:po.poDate,customerName:(customer(po.customerId)||{}).name||'—',
      totalQty,sufficient:shortageUnits===0,shortageUnits}; });
  const price=it=>Number(it.price)||0;
  const shortfalls=[],excess=[];
  DB.items.forEach(i=>{ const req=required[i.id]||0; const onHand=Number(i.stockInHand)||0;
    if(req>onHand){ const s=req-onHand; shortfalls.push({itemId:i.id,itemName:i.name,partNumber:i.partNumber,materialType:i.materialType,
      source:i.source,vendorName:i.vendorName,required:req,onHand,shortage:s,shortageValue:+(s*price(i)).toFixed(2)}); }
    else if(onHand>req){ const ex=onHand-req; excess.push({itemId:i.id,itemName:i.name,partNumber:i.partNumber,materialType:i.materialType,
      source:i.source,onHand,requiredByOpenPos:req,excess:ex,excessValue:+(ex*price(i)).toFixed(2)}); } });
  shortfalls.sort((a,b)=>b.shortageValue-a.shortageValue); excess.sort((a,b)=>b.excessValue-a.excessValue);
  const lastMove={}; DB.movements.forEach(m=>{ const d=new Date(m.createdAt);
    if(!lastMove[m.itemId]||d>lastMove[m.itemId]) lastMove[m.itemId]=d; });
  const now=Date.now(); const deadStock=[];
  DB.items.forEach(i=>{ const onHand=Number(i.stockInHand)||0; if(onHand<=0) return;
    const last=lastMove[i.id]||new Date(i.createdAt); const daysIdle=Math.floor((now-last.getTime())/86400000);
    if(daysIdle>=deadDays) deadStock.push({itemId:i.id,itemName:i.name,partNumber:i.partNumber,materialType:i.materialType,
      source:i.source,onHand,stockValue:+(onHand*price(i)).toFixed(2),lastMovement:last.toISOString().slice(0,10),daysIdle}); });
  deadStock.sort((a,b)=>b.daysIdle-a.daysIdle);
  const totals={openPos:openPos.length,shortfallItems:shortfalls.length,
    shortfallUnits:shortfalls.reduce((s,r)=>s+r.shortage,0),shortfallValue:+shortfalls.reduce((s,r)=>s+r.shortageValue,0).toFixed(2),
    excessItems:excess.length,excessValue:+excess.reduce((s,r)=>s+r.excessValue,0).toFixed(2),
    deadItems:deadStock.length,deadValue:+deadStock.reduce((s,r)=>s+r.stockValue,0).toFixed(2),
    lowStock:DB.items.filter(i=>Number(i.minStock)>0&&(Number(i.stockInHand)||0)<Number(i.minStock)).length};
  return {totals,shortfalls,excess,deadStock,openPos:poRows.sort((a,b)=>b.id-a.id)};
}

let cmpKey='', cmpQ='';
function articleGroups(){
  const g={};
  DB.items.forEach(it=>{ if(!it.vendorId) return; // inhouse items have no vendor to compare
    const pn=String(it.partNumber||'').trim().toLowerCase();
    const k=pn?('pn:'+pn):('nm:'+String(it.name||'').trim().toLowerCase());
    (g[k]=g[k]||{key:k,name:it.name,partNumber:it.partNumber||'',rows:[]}).rows.push(it); });
  return Object.values(g).sort((a,b)=>String(a.name).localeCompare(String(b.name)));
}
function parseDays(v){ const s=String(v||''); const m=s.match(/([\d.]+)/); if(!m) return null;
  let n=parseFloat(m[1]); if(/week/i.test(s)) n*=7; else if(/month/i.test(s)) n*=30; return Math.round(n); }
function vendorCmpRows(gr){
  const seen={};
  const extra=[];
  gr.rows.forEach(r=>{ itemVendorPrices(r.id).forEach(iv=>{ const v=vendor(iv.vendorId)||{};
    extra.push({ vendorName:iv.vendorName||v.name||'—', price:Number(iv.price)>0?Number(iv.price):null,
      leadDays:parseDays(r.leadTime), leadText:r.leadTime||'—',
      creditDays:parseDays(v.creditDays), creditText:(v.creditDays!==''&&v.creditDays!=null)?(v.creditDays+' days'):'—',
      inHand:Number(r.stockInHand||0) }); }); });
  return gr.rows.map(r=>{ const v=vendor(r.vendorId)||{};
    return { vendorName:r.vendorName||v.name||'—', price:Number(r.price)>0?Number(r.price):null,
      leadDays:parseDays(r.leadTime), leadText:r.leadTime||'—',
      creditDays:parseDays(v.creditDays), creditText:(v.creditDays!==''&&v.creditDays!=null)?(v.creditDays+' days'):'—',
      inHand:Number(r.stockInHand||0) };
  }).concat(extra).filter(r=>{ if(seen[r.vendorName]) return false; seen[r.vendorName]=1; return true; }); // one row per vendor
}
function cmpBars(title, rows, valFn, fmt, bestFn){
  const vals=rows.map(valFn);
  const best=bestFn(vals);
  const max=Math.max(...vals.filter(v=>v!=null),0);
  return `<div style="flex:1;min-width:230px"><div style="font-weight:700;font-size:12px;margin-bottom:6px;color:#1e1b4b">${title}</div>
  ${rows.map((r,i)=>{ const v=valFn(r); const w=v!=null&&max>0?Math.max(6,Math.round(v/max*100)):0; const isBest=i===best&&v!=null;
    return `<div style="display:flex;align-items:center;gap:6px;margin-bottom:4px">
      <div style="width:118px;font-size:11px;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(r.vendorName)}">${esc(r.vendorName)}</div>
      <div style="flex:1;background:#f1f5f9;border-radius:4px;height:18px;overflow:hidden"><div style="height:100%;width:${w}%;background:${isBest?'#059669':'#6366f1'};border-radius:4px"></div></div>
      <div style="width:72px;font-size:11px;font-weight:${isBest?'700':'400'};color:${isBest?'#059669':'#334155'}">${v!=null?fmt(v):'—'}${isBest?' ★':''}</div></div>`; }).join('')}</div>`;
}
const bestMin = vals => { let bi=-1,bv=null; vals.forEach((v,i)=>{ if(v!=null&&(bv===null||v<bv)){bv=v;bi=i;} }); return bi; };
const bestMax = vals => { let bi=-1,bv=null; vals.forEach((v,i)=>{ if(v!=null&&(bv===null||v>bv)){bv=v;bi=i;} }); return bi; };
function cmpChartHTML(key){
  const gr=articleGroups().find(g=>g.key===key);

}

    <span id="ocr_st" class="mut" style="font-size:12px;margin-left:8px"></span></div></div>
  <div class="card" style="padding:14px;margin-bottom:14px"><b>🗂️ Dropdown categories</b>
    <p class="mut" style="margin:6px 0 10px;font-size:12px">Options for Company, Material Type, Source and Payment Mode dropdowns — stored in the sheet, so the whole team sees the same lists. Delete with ✕, add at the bottom of each group. (You can also add inline: pick “＋ New…” inside any dropdown.)</p>
    <div id="cat_mgr"></div></div>
  <div class="card" style="padding:14px;margin-bottom:14px"><b>📷 Image Staging (Google Drive)</b>
    <p class="mut" style="margin:6px 0 10px;font-size:12px">Add photos here with a proper name — each is renamed (<code>PART_&lt;name&gt;.jpg</code> or <code>PRODUCT_&lt;name&gt;.jpg</code>) and saved in the app's Drive folder. Access them any time below, <b>download (⬇)</b>, and when ready add them to the repo's <code>images/</code> folder to assign via the <b>📁 repo pool</b>.</p>
    <div class="frow3"><div><span class="lbl">Photo *</span><input type="file" accept="image/*" id="stg_file" style="width:100%"></div>
    <div><span class="lbl">Name for the image *</span><input id="stg_name" style="width:100%" placeholder="e.g. DVR rear plate"></div>
    <div><span class="lbl">Type</span><select id="stg_kind" style="width:100%"><option value="PART">Part / Inventory image</option><option value="PRODUCT">Product / Packing image</option></select></div></div>
    <div style="margin-top:10px"><button class="btn" id="stgGo" onclick="stagedUpload()">⬆ Upload to Drive staging</button>
    <button class="btn o" onclick="renderStaged()">↻ Refresh list</button></div>
    <div id="stg_list" style="margin-top:12px"><p class="mut" style="font-size:12px">Loading staged photos…</p></div></div>
  <div class="card" style="padding:14px;margin-bottom:14px"><b>Change Passcode</b>
    <p class="mut" style="margin:6px 0 10px;font-size:12px">Stored (as a hash) in the <code>Settings</code> tab of your Google Sheet — everyone gets the new passcode immediately. Minimum 4 characters.</p>
    <div class="frow3"><div><span class="lbl">Current Passcode</span><input id="pc_cur" type="password" style="width:100%"></div>
    <div><span class="lbl">New Passcode</span><input id="pc_new" type="password" style="width:100%"></div>
    <div><span class="lbl">Confirm New</span><input id="pc_cf" type="password" style="width:100%"></div></div>
    <button class="btn" id="pcGo" onclick="changePass()">Update Passcode</button></div>
  <div class="card" style="padding:14px;margin-bottom:14px"><b>Backup & Restore</b>
    <p class="mut" style="margin:6px 0 10px">Download the entire database as JSON, or restore it into a fresh spreadsheet. (Images live in Google Drive and are not part of this backup.)</p>
    <button class="btn o" onclick="download('megaverks-backup-'+today()+'.json',JSON.stringify(DB),'application/json')">⬇ Export all data (JSON)</button>
    <input type="file" id="rst" accept=".json" style="margin-left:8px" onchange="restoreAll(this)"></div>
  <div class="card tblwrap"><div style="padding:14px 14px 4px;font-weight:700">Audit Log (last ${aud.length})</div>
   <table><thead><tr><th>When</th><th>Actor</th><th>Action</th><th>Entity</th><th>Detail</th></tr></thead><tbody>
   ${aud.map(a=>`<tr><td class="mut" style="font-size:12px">${esc(a.createdAt)}</td><td>${esc(a.actor)}</td>
     <td><span class="badge ${/remove|delete/.test(a.action)?'rd':/bulk|stock|payment|dispatch/.test(a.action)?'bl':'gr'}">${esc(a.action)}</span></td>
     <td>${esc(a.entity)} #${esc(a.entityId)}</td><td class="mut">${esc(a.detail)}</td></tr>`).join('')||'<tr><td colspan="5" class="mut" style="text-align:center;padding:20px">No activity yet.</td></tr>'}
   </tbody></table></div>`;
  renderStaged();
  loadOcrSettings();
  renderCatMgr();
}
async function loadOcrSettings(){ try{ const r=await api({action:'getOcr'});
  $('#ocr_prov').value=r.provider||'huggingface'; $('#ocr_ep').value=r.endpoint||''; $('#ocr_tok').value=r.token||'';
  $('#ocr_st').textContent='Loaded from sheet'; }catch(e){ $('#ocr_st').textContent='Could not load: '+e.message; } }
async function saveOcrSettings(){ try{ $('#ocrGo').disabled=true;
  await api({action:'saveOcr',provider:$('#ocr_prov').value,endpoint:$('#ocr_ep').value.trim(),hfToken:$('#ocr_tok').value.trim()});
  $('#ocr_st').textContent='✓ Saved — OCR in Bills uses this engine now'; $('#ocr_st').style.color='#059669'; toast('OCR settings saved','ok');
  }catch(e){ $('#ocr_st').textContent=e.message; toast(e.message,'err'); } $('#ocrGo').disabled=false; }
function renderCatMgr(){ const el=$('#cat_mgr'); if(!el) return;
  el.innerHTML = OPTION_CATS.map(cat=>{ const opts=(((DB.options||{})[cat])||[]).filter(Boolean);
    return `<div style="margin-bottom:10px"><div style="font-size:12px;font-weight:700;margin-bottom:4px">${esc(OPTION_LABELS[cat]||cat)}</div>
    <div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center">${opts.map(o=>
      `<span class="badge gr" style="display:inline-flex;align-items:center;gap:5px">${esc(o)}<a href="#" onclick="delCatOpt('${cat}','${esc(o).replace(/'/g,"\'")}');return false" style="color:#dc2626;text-decoration:none;font-weight:700" title="Delete">✕</a></span>`).join('')||'<span class="mut" style="font-size:11px">no options</span>'}
    <span style="display:inline-flex;gap:4px;margin-left:4px"><input id="cat_add_${cat}" placeholder="Add…" style="width:110px;padding:2px 6px;font-size:12px">
    <button class="btn o sm" onclick="addCatOpt('${cat}')">＋ Add</button></span></div></div>`; }).join(''); }
async function addCatOpt(cat){ const inp=$('#cat_add_'+cat); const v=(inp.value||'').trim(); if(!v) return;
  const cur=(((DB.options||{})[cat])||[]).slice();
  if(!cur.map(x=>String(x).toLowerCase()).includes(v.toLowerCase())) cur.push(v);
  try{ DB.options=await api({action:'saveOptions',options:Object.assign({},DB.options,{[cat]:cur})});
    renderCatMgr(); toast('Added “'+v+'” to '+(OPTION_LABELS[cat]||cat),'ok'); }catch(e){ toast(e.message,'err'); } }
function delCatOpt(cat,val){ confirmDlg('Delete option <b>'+esc(val)+'</b> from '+(OPTION_LABELS[cat]||cat)+'? Existing records keep their value; it just disappears from the dropdown.',async()=>{
  const cur=(((DB.options||{})[cat])||[]).filter(x=>x!==val);
  try{ DB.options=await api({action:'saveOptions',options:Object.assign({},DB.options,{[cat]:cur})});
    renderCatMgr(); toast('Deleted “'+val+'”','ok'); }catch(e){ toast(e.message,'err'); } }); }
async function changePass(){
  const cur=$('#pc_cur').value, nw=$('#pc_new').value, cf=$('#pc_cf').value;
  if(nw.length<4) return toast('New passcode must be at least 4 characters','err');
  if(nw!==cf) return toast('New passcodes do not match','err');
  try{ $('#pcGo').disabled=true;
    await api({action:'changePasscode',current:cur,next:nw});
    toast('Passcode changed for everyone','ok');
    $('#pc_cur').value=$('#pc_new').value=$('#pc_cf').value=''; }
  catch(e){ toast(e.message,'err'); }
  $('#pcGo').disabled=false;
}
async function fixImgSharing(){
  try{ toast('Checking every uploaded image…');
    const r=await api({action:'fixImageSharing'});
    if(r.verified===r.total) toast('✅ '+r.verified+'/'+r.total+' images verified publicly readable — hard-refresh (Ctrl+Shift+R) to see all photos','ok');
    else toast('⚠ Google blocked public sharing on '+(r.total-r.verified)+' of '+r.total+' image(s). No problem — the app now loads photos through the backend instead. Hard-refresh (Ctrl+Shift+R) and they will display.','err');
  }catch(e){ toast(e.message,'err'); } }
async function testConn(){ try{ const r=await api({action:'ping'}); toast('Connected — '+r.version,'ok'); }
  catch(e){ toast('Failed: '+e.message,'err'); } }
async function runSelfTest(){
  const box=$('#st_out'), btn=$('#stBtn'); if(btn) btn.disabled=true;
  box.innerHTML='<p class="mut" style="font-size:12px">Running self-test on the backend…</p>';
  try{
    const r=await api({action:'selftest'});
    box.innerHTML=`<p style="margin:4px 0 6px"><span class="badge ${r.pass?'g':'rd'}">${r.okCount}/${r.total} checks passed</span>
      <span class="mut" style="font-size:11px"> ${esc(r.time)}</span></p>
      <table style="font-size:12.5px">${r.checks.map(c=>`<tr><td style="padding:3px 8px">${c.ok?'✅':'❌'}</td>
        <td style="padding:3px 8px">${esc(c.name)}</td><td class="mut" style="padding:3px 8px">${esc(c.detail)}</td></tr>`).join('')}</table>`;
    toast(r.pass?'Backend self-test passed ✓':'Self-test found issues — see below', r.pass?'ok':'err');
  }catch(e){
    box.innerHTML=`<p style="color:#dc2626;font-size:12.5px">Self-test failed: ${esc(e.message)}</p>`;
  }
  if(btn) btn.disabled=false;
}
async function restoreAll(inp){ const f=inp.files[0]; if(!f) return;
  if(!confirm('Restore '+f.name+' ? Existing rows with same IDs are overwritten; new rows appended.')) return;
  try{ const data=JSON.parse(await f.text());
    for(const e of ENTITIES){ if(e==='audit') continue;
      for(const rec of (data[e]||[])) await api({action:'update',entity:e,record:rec}).catch(()=>api({action:'create',entity:e,record:rec})); }
    reloadAndStay('Restore complete'); }catch(e){ toast('Restore failed: '+e.message,'err'); } }
function bulkDlg(entity){
  const names={items:'Inventory Items',vendors:'Vendors',products:'Products',pos:'Purchase Orders'};
  const notes={items:['Existing items (same company + name + part number) are updated; new ones added.',
    "Vendor names matching the Vendor Database are auto-linked.","Columns (any order): "+Object.keys(ALIASES.items).join(', ')],
    vendors:['Matched by vendor name (update) else created. Credit days default 30.'],
    products:['Matched by name + company.'],
    pos:['One row per line — repeat the PO Number for each line. Customers auto-created; products must exist; existing PO numbers skipped.']};
  modal('Bulk Upload — '+names[entity],`
  ${notes[entity].map(n=>`<div class="note" style="margin:4px 0">${esc(n)}</div>`).join('')}
  <span class="lbl">Paste CSV (copied from Excel) or choose a .csv file</span>
  <input type="file" id="bk_file" accept=".csv" style="margin-bottom:8px">
  <textarea id="bk_text" rows="7" style="width:100%" placeholder="Item Name,Part Number,Vendor Name,Price,Stock In Hand&#10;M6 CAGE NUT,M6 X 20,BENGLORE FASTENERS,3.40,2000"></textarea>
  <div id="bk_prev"></div>`,
  `<button class="btn o" onclick="document.querySelector('.overlay').remove()">Cancel</button><button class="btn" id="bkGo" onclick="runBulk('${entity}')">Upload</button>`);
  $('#bk_file').onchange=async e=>{ const f=e.target.files[0]; if(f) $('#bk_text').value=await f.text(); };
}
async function runBulk(entity){
  const grid=parseCSV($('#bk_text').value); if(grid.length<2) return toast('Paste CSV with a header row first','err');
  const map=mapHeaders(grid[0],ALIASES[entity]); if(map.name===undefined&&entity!=='pos') return toast('Could not find a name column — check headers','err');
  if(entity==='pos'&&map.poNumber===undefined) return toast('Could not find PO Number column','err');
  const rows=grid.slice(1).map(r=>{ const o={}; for(const k in map) o[k]=r[map[k]]||''; return o; }).filter(o=>Object.values(o).some(v=>String(v).trim()));
  if(!rows.length) return toast('No data rows','err');
  $('#bk_prev').innerHTML=`<pre class="pv">Parsed ${rows.length} row(s):\n${esc(JSON.stringify(rows.slice(0,5),null,1))}${rows.length>5?'\n…':''}</pre>`;
  try{ $('#bkGo').disabled=true;
    const res=await api({action:'bulk',entity,rows});
    document.querySelector('.overlay').remove();
    reloadAndStay(`Bulk done — ${res.added||0} added, ${res.updated||0} updated${res.skipped?`, ${res.skipped} skipped`:''}`); }
  catch(e){ $('#bkGo').disabled=false; toast(e.message,'err'); } }

/* ================= BOOT ================= */
(async function(){
  if(ACTOR){ $('#actorBtn').textContent=ACTOR; $('#actorBtn').classList.add('set'); }
  const ok=await gate();                 // passcode screen first
  if(!ok){                               // setup mode: no backend URL yet → open Admin directly
    location.hash='#admin'; route();
    setTimeout(()=>toast('Paste your Apps Script /exec URL below and Save Settings','err'),300);
    return;
  }
  $('#logoutBtn').style.display='block';
  let loaded=true;
  try{ await loadAll(); }
  catch(e){ loaded=false;
    $('#app').innerHTML=`<div class="card" style="padding:24px;max-width:560px;margin:40px auto">
    <b>Cannot reach the backend.</b><p class="sub" style="margin:8px 0">${esc(e.message)}</p>
    <p style="font-size:13px">1. Create the Apps Script (Code.gs) in a Google Sheet → Deploy → Web app (access: <i>Anyone</i>).<br>
    2. Open <a href="#admin">Admin → Settings</a> and paste the <code>/exec</code> URL, then reload.</p>
    <a class="btn" href="#admin" style="display:inline-block;text-decoration:none">Go to Settings</a></div>`; }
  syncStamp();
  startAutoSync();
  if(loaded){
    // once-per-day cloud backup (server no-ops if already backed up in last 24h)
    api({action:'autoBackup'}).then(r=>{ if(r && r.backedUp) toast('Daily cloud backup created in Drive folder "MEGAVERKS Backups"','ok'); }).catch(()=>{});
    route();
  }
})();
</script>
